<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電材スキャンULTIMATE</title>

<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center;}
.wrap{padding:10px;max-width:900px;margin:auto;}
button{width:100%;padding:14px;margin:5px;border:none;border-radius:10px;background:#00c853;color:#fff;font-size:16px;}
input{width:100%;padding:10px;margin:5px;border-radius:8px;border:none;}
video{width:100%;max-height:40vh;}
a{display:block;background:#2962ff;margin:5px;padding:10px;border-radius:8px;color:#fff;text-decoration:none;}
.card{background:#222;padding:10px;margin:8px 0;border-radius:10px;}
img{max-width:200px;border-radius:8px;}
</style>
</head>

<body>
<div class="wrap">

<h2>📷 電材スキャンULTIMATE</h2>

<input id="site" placeholder="現場名">
<input id="manual" placeholder="品番入力">

<button onclick="startCamera()">カメラ</button>
<button onclick="scan()">スキャン</button>
<button onclick="shareLine()">LINE送信</button>
<button onclick="printData()">印刷</button>
<button onclick="stopCamera()">停止</button>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none"></canvas>

<div id="result"></div>
<div id="links"></div>
<div id="history"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
let db,stream,worker,last;

// DB
const req=indexedDB.open("db",1);
req.onupgradeneeded=e=>{
 db=e.target.result;
 db.createObjectStore("r",{keyPath:"id",autoIncrement:true});
};
req.onsuccess=e=>{db=e.target.result;load();};

// カメラ
async function startCamera(){
 if(stream) return;
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
 video.srcObject=stream;
}
function stopCamera(){
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
 video.srcObject=null;
}

// OCR
async function getWorker(){
 if(worker) return worker;
 worker=await Tesseract.createWorker("eng");
 await worker.setParameters({tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-/"});
 return worker;
}

// スキャン
async function scan(){
 const ctx=canvas.getContext("2d");
 canvas.width=video.videoWidth;
 canvas.height=video.videoHeight;
 ctx.drawImage(video,0,0);

 let product="";

 // バーコード
 if("BarcodeDetector" in window){
  try{
   const d=new BarcodeDetector();
   const r=await d.detect(canvas);
   if(r.length) product=r[0].rawValue;
  }catch{}
 }

 // OCR
 if(!product){
  const w=await getWorker();
  const r=await w.recognize(canvas);
  product=r.data.text.replace(/\s/g,"")
   .replace(/O/g,"0").replace(/[IL]/g,"1")
   .toUpperCase().trim();
 }

 if(!product) product=prompt("品番入力")||"";

 manual.value=product;

 const data={
  product,
  site:site.value||"未設定",
  date:new Date().toLocaleString(),
  img:canvas.toDataURL("image/jpeg",0.8)
 };

 last=data;
 save(data);
 show(data);
}

// 表示
function show(d){
 result.innerHTML=`<b>${d.product}</b><br>${d.site}<br>${d.date}<br><img src="${d.img}">`;

 const p=d.product;
 links.innerHTML=`
 <a href="https://www.google.com/search?q=${p}+仕様書+pdf" target="_blank">仕様書</a>
 <a href="https://www.google.com/search?q=${p}+寸法図+pdf" target="_blank">寸法図</a>
 <a href="https://www.google.com/search?q=${p}+配線図" target="_blank">配線図</a>`;
}

// 保存
function save(d){
 const tx=db.transaction("r","readwrite");
 tx.objectStore("r").add(d);
 tx.oncomplete=load;
}

// 履歴
function load(){
 const tx=db.transaction("r","readonly");
 const r=tx.objectStore("r").getAll();
 r.onsuccess=()=>{
  history.innerHTML=r.result.reverse().map(x=>`
   <div class="card">
    ${x.site}<br>${x.product}<br>${x.date}
    <button onclick="reuse('${x.product}','${x.site}')">再利用</button>
   </div>`).join("");
 };
}

function reuse(p,s){
 manual.value=p;
 site.value=s;
}

// LINE
async function shareLine(){
 if(!last) return alert("なし");
 const text=`${last.site}\n${last.product}\n${last.date}`;
 if(navigator.share){
  await navigator.share({text});
 }else{
  window.open("https://line.me/R/msg/text/?"+encodeURIComponent(text));
 }
}

// 印刷
function printData(){
 if(!last) return alert("なし");
 const w=window.open("");
 w.document.write(`
  <h2>${last.site}</h2>
  <p>${last.product}</p>
  <p>${last.date}</p>
  <img src="${last.img}" style="width:300px">
 `);
 w.print();
 w.close();
}
</script>

</body>
</html>
