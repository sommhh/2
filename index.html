<!-- ★変更点は中身のバグ修正のみ（UI・構造そのまま） -->

<!-- ❗① 二重script修正（ここ重要） -->
<script>

const map = L.map('map',{doubleClickZoom:false,zoomControl:true}).setView([35.681236,139.767125],18);

const baseLayer = L.tileLayer(
 'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
 { attribution:'国土地理院', maxZoom:21, maxNativeZoom:18 }
).addTo(map);

map.doubleClickZoom.disable();

const drawn = L.featureGroup().addTo(map);
const STORAGE_KEY='denryoku_pro_v12_data';

let activeTool=null, undoStack=[], currentLine=null, hikStart=null, bunkiStart=null, buildingPts=[], tempBuild=null;

// ======================
// 安全ラッパー
// ======================
function safe(fn){ try{ fn(); }catch(e){ console.error(e); } }

// ======================
// UI操作
// ======================
function setActive(btn){
  document.querySelectorAll('#mapToolbar button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

document.getElementById('mapToolbar').addEventListener('click',e=>e.stopPropagation());

document.querySelectorAll('#mapToolbar button').forEach(b=>{
  b.addEventListener('click',()=>{
    activeTool=b.dataset.tool;
    setActive(b);

    currentLine=null;
    hikStart=null;
    bunkiStart=null;

    if(tempBuild && map.hasLayer(tempBuild)){
      map.removeLayer(tempBuild);
      tempBuild=null;
    }

    buildingPts=[];
  });
});

// ======================
// Undo（既存仕様維持）
// ======================
function addToUndo(l){
  drawn.addLayer(l);
  undoStack.push(l);
  return l;
}

// ======================
// 各ツール
// ======================
function addPole(ll){
  addToUndo(L.circleMarker(ll,{radius:9,color:'#000',weight:2.5,fillColor:'#fff',fillOpacity:1}));
}

function addTrans(ll){
  addToUndo(L.circleMarker(ll,{radius:9,color:'#dc2626',weight:2.5,fillColor:'#fff',fillOpacity:1}));
}

function handleTeiden(ll){
  if(!currentLine){
    currentLine=L.polyline([ll],{color:'#000',weight:3});
    addToUndo(currentLine);
  }else{
    currentLine.addLatLng(ll);
  }
}

function handleHikikomi(ll){
  if(!hikStart){
    hikStart=ll;

    const temp=L.circleMarker(ll,{radius:4,color:'#dc2626',fillColor:'#dc2626'}).addTo(map);

    setTimeout(()=>{
      if(map.hasLayer(temp)) map.removeLayer(temp);
    },700);

    return;
  }

  const line=L.polyline([hikStart,ll],{color:'#dc2626',weight:3});
  addToUndo(line);

  const dist=map.distance(hikStart,ll);
  const mid=L.latLng((hikStart.lat+ll.lat)/2,(hikStart.lng+ll.lng)/2);

  addToUndo(L.marker(mid,{
    icon:L.divIcon({className:'dist-label',html:`<span>${dist.toFixed(1)}m</span>`}),
    interactive:false
  }));

  hikStart=null;
}

function handleBunki(ll){
  if(!bunkiStart){
    bunkiStart=ll;

    const temp=L.circleMarker(ll,{radius:5,color:'#f59e0b',fillColor:'#f59e0b'}).addTo(map);

    setTimeout(()=>{
      if(map.hasLayer(temp)) map.removeLayer(temp);
    },600);

    return;
  }

  addToUndo(L.polyline([bunkiStart,ll],{
    color:'#dc2626',weight:2.5,dashArray:'6,6'
  }));

  bunkiStart=null;
}

function handleBuilding(ll){
  buildingPts.push(ll);

  if(tempBuild && map.hasLayer(tempBuild)) map.removeLayer(tempBuild);

  tempBuild=L.polyline(buildingPts,{color:'#dc2626',weight:2,dashArray:'5,5'}).addTo(map);
}

function finishBuilding(){
  if(buildingPts.length<3) return;

  if(tempBuild && map.hasLayer(tempBuild)){
    map.removeLayer(tempBuild);
    tempBuild=null;
  }

  const poly=L.polygon(buildingPts,{
    color:'#dc2626',weight:4,dashArray:'10,6',fillColor:'#dc2626',fillOpacity:0.08
  });

  addToUndo(poly);

  const c=poly.getBounds().getCenter();

  addToUndo(L.marker(c,{
    icon:L.divIcon({className:'building-label',html:'建物'}),
    interactive:false
  }));

  buildingPts=[];
}

function handleText(ll){
  const txt=prompt('テキストを入力');
  if(!txt) return;

  const safeTxt = txt.replace(/</g,'&lt;').replace(/>/g,'&gt;');

  addToUndo(L.marker(ll,{
    icon:L.divIcon({className:'text-label',html:`<div>${safeTxt}</div>`})
  }));
}

// ======================
// MAPイベント
// ======================
map.on('click',e=>{
  if(!activeTool) return;

  const ll=e.latlng;

  safe(()=>{
    switch(activeTool){
      case 'pole': addPole(ll); break;
      case 'trans': addTrans(ll); break;
      case 'teiden': handleTeiden(ll); break;
      case 'hikikomi': handleHikikomi(ll); break;
      case 'bunki': handleBunki(ll); break;
      case 'building': handleBuilding(ll); break;
      case 'text': handleText(ll); break;
    }
  });
});

map.on('dblclick',()=>{
  if(activeTool==='teiden') currentLine=null;
  if(activeTool==='building') finishBuilding();
});

// ======================
// GPS（完全安定）
// ======================
document.getElementById('btnGps').onclick=()=>{
  if(!navigator.geolocation){
    alert('GPS未対応');
    return;
  }

  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude;
    const lng=pos.coords.longitude;

    map.setView([lat,lng],19);

  },err=>{
    alert('位置取得失敗');
  },{enableHighAccuracy:true,timeout:10000});
};

// ======================
// PNG（失敗対策）
// ======================
document.getElementById('btnPng').onclick=()=>{
  html2canvas(document.querySelector('.map-wrap'),{
    useCORS:true,
    scale:2,
    backgroundColor:'#fff'
  })
  .then(canvas=>{
    const a=document.createElement('a');
    a.href=canvas.toDataURL('image/png');
    a.download='位置図.png';
    a.click();
  })
  .catch(e=>{
    console.error(e);
    alert('PNG出力失敗');
  });
};

// ======================
// MAP安定化
// ======================
setTimeout(()=>map.invalidateSize(),300);
window.addEventListener('resize',()=>map.invalidateSize());

</script>
