<script>// Playables SDK v1.0.0
// Game lifecycle bridge: rAF-based game-ready detection + event communication
(function() {
  'use strict';

  // Idempotency: skip if already initialized (e.g., server-side injection
  // followed by client-side inject-javascript via the Bloks webview component).
  if (window.playablesSDK) return;

  var HANDLER_NAME = 'playablesGameEventHandler';
  var ANDROID_BRIDGE_NAME = '_MetaPlayablesBridge';
  var RAF_FRAME_THRESHOLD = 3;

  var gameReadySent = false;
  var firstInteractionSent = false;
  var errorSent = false;
  var frameCount = 0;
  var originalRAF = window.requestAnimationFrame;

  // --- Transport Layer ---

  function hasIOSBridge() {
    return !!(window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers[HANDLER_NAME]);
  }

  function hasAndroidBridge() {
    return !!(window[ANDROID_BRIDGE_NAME] &&
              typeof window[ANDROID_BRIDGE_NAME].postEvent === 'function');
  }

  function isInIframe() {
    return !!(window.parent && window.parent !== window);
  }

  function sendEvent(eventName, payload) {
    var message = {
      type: eventName,
      payload: payload || {},
      timestamp: Date.now()
    };

    if (hasIOSBridge()) {
      try {
        window.webkit.messageHandlers[HANDLER_NAME].postMessage(message);
      } catch (e) { /* ignore */ }
      return;
    }

    if (hasAndroidBridge()) {
    try {
      var p = payload || {};
      p.__secureToken = window.__fbAndroidBridgeAuthToken || '';
      window[ANDROID_BRIDGE_NAME].postEvent(
        eventName,
        JSON.stringify(p)
      );
    } catch (e) { /* ignore */ }
    return;
  }

    if (isInIframe()) {
      try {
        window.parent.postMessage(message, '*');
      } catch (e) { /* ignore */ }
      return;
    }
  }

  // --- rAF Game-Ready Detection ---

  function onFrame() {
    if (gameReadySent) return;

    frameCount++;
    if (frameCount >= RAF_FRAME_THRESHOLD) {
      gameReadySent = true;
      sendEvent('game_ready', {
        frame_count: frameCount,
        detected_at: Date.now()
      });
      return;
    }

    originalRAF.call(window, onFrame);
  }

  if (originalRAF) {
    window.requestAnimationFrame = function(callback) {
      if (!gameReadySent) {
        return originalRAF.call(window, function(timestamp) {
          frameCount++;
          if (frameCount >= RAF_FRAME_THRESHOLD && !gameReadySent) {
            gameReadySent = true;
            sendEvent('game_ready', {
              frame_count: frameCount,
              detected_at: Date.now()
            });
          }
          callback(timestamp);
        });
      }
      return originalRAF.call(window, callback);
    };
  }

  // --- First User Interaction Detection ---

  function setupFirstInteractionDetection() {
    var events = ['touchstart', 'mousedown', 'keydown'];

    function onFirstInteraction() {
      if (firstInteractionSent) return;
      firstInteractionSent = true;
      sendEvent('user_interaction_start', null);

      for (var i = 0; i < events.length; i++) {
        document.removeEventListener(events[i], onFirstInteraction, true);
      }
    }

    for (var i = 0; i < events.length; i++) {
      document.addEventListener(events[i], onFirstInteraction, true);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupFirstInteractionDetection);
  } else {
    setupFirstInteractionDetection();
  }

  // --- Auto Error Capture ---

  window.addEventListener('error', function(event) {
    if (errorSent) return;
    errorSent = true;
    sendEvent('error', {
      message: event.message || 'Unknown error',
      source: event.filename || '',
      lineno: event.lineno || 0,
      colno: event.colno || 0,
      auto_captured: true
    });
  });

  window.addEventListener('unhandledrejection', function(event) {
    if (errorSent) return;
    errorSent = true;
    var reason = event.reason;
    sendEvent('error', {
      message: (reason instanceof Error) ? reason.message : String(reason),
      type: 'unhandled_promise_rejection',
      auto_captured: true
    });
  });

  // --- Public API ---

  window.playablesSDK = {
    complete: function(score) {
      sendEvent('game_ended', {
        score: score,
        completed: true
      });
    },

    error: function(message) {
      if (errorSent) return;
      errorSent = true;
      sendEvent('error', {
        message: message || 'Unknown error',
        auto_captured: false
      });
    },

    sendEvent: function(eventName, payload) {
      if (!eventName || typeof eventName !== 'string') return;
      sendEvent(eventName, payload);
    }
  };

  // Kick off rAF detection in case no game code calls rAF immediately
  if (originalRAF) {
    originalRAF.call(window, onFrame);
  }
})();</script>

<script>
const { jsPDF } = window.jspdf;

class ElectricalDiagramEditor {
  constructor() {
    this.canvas = document.getElementById('mainCanvas');
    this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
    this.baseImage = null;
    this.symbols = [];
    this.wires = [];
    this.perspectivePoints = [];
    this.undoStack = [];
    this.redoStack = [];
    
    this.mode = 'idle';
    this.selectedSymbolType = null;
    this.isDeleteMode = false;
    this.isPerspectiveMode = false;
    
    this.imageOpacity = 0.5;
    this.imageContrast = 1.0;
    this.zoom = 1.0;
    this.panOffset = { x: 0, y: 0 };
    this.isDragging = false;
    this.dragStart = { x: 0, y: 0 };
    
    this.tempWireStart = null;
    this.snapToGrid = true;
    this.autoSnapLine = false;
    this.gridSize = 10;
    
    this.initEventListeners();
    this.render();
  }

  initEventListeners() {
    // Step navigation
    document.querySelectorAll('.step-btn').forEach(btn => {
      btn.addEventListener('click', () => this.switchStep(btn.dataset.step));
    });

    // Image upload
    document.getElementById('imageInput').addEventListener('change', (e) => this.loadImage(e));
    
    // Image controls
    document.getElementById('opacitySlider').addEventListener('input', (e) => {
      this.imageOpacity = e.target.value / 100;
      document.getElementById('opacityVal').textContent = e.target.value;
      this.render();
    });
    
    document.getElementById('contrastSlider').addEventListener('input', (e) => {
      this.imageContrast = e.target.value / 100;
      document.getElementById('contrastVal').textContent = e.target.value;
      this.render();
    });

    document.getElementById('perspectiveBtn').addEventListener('click', () => this.startPerspectiveMode());
    document.getElementById('applyPerspectiveBtn').addEventListener('click', () => this.applyPerspective());

    // Symbol buttons
    document.querySelectorAll('.symbol-btn').forEach(btn => {
      btn.addEventListener('click', () => this.selectSymbol(btn.dataset.symbol, btn));
    });

    document.getElementById('snapToGrid').addEventListener('change', (e) => {
      this.snapToGrid = e.target.checked;
    });

    document.getElementById('deleteModeBtn').addEventListener('click', () => this.toggleDeleteMode());

    // Wire controls
    document.getElementById('autoSnapLine').addEventListener('change', (e) => {
      this.autoSnapLine = e.target.checked;
    });
    document.getElementById('cancelWireBtn').addEventListener('click', () => {
      this.tempWireStart = null;
      this.mode = 'wire';
      document.getElementById('cancelWireBtn').classList.add('hidden');
      this.render();
    });

    // PDF
    document.getElementById('generatePdfBtn').addEventListener('click', () => this.generatePDF());

    // Canvas interactions
    this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
    this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
    this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));
    this.canvas.addEventListener('touchstart', (e) => this.handleTouchStart(e), { passive: false });
    this.canvas.addEventListener('touchmove', (e) => this.handleTouchMove(e), { passive: false });
    this.canvas.addEventListener('touchend', (e) => this.handleTouchEnd(e));

    // Zoom controls
    document.getElementById('zoomInBtn').addEventListener('click', () => this.setZoom(this.zoom * 1.2));
    document.getElementById('zoomOutBtn').addEventListener('click', () => this.setZoom(this.zoom / 1.2));
    document.getElementById('resetViewBtn').addEventListener('click', () => {
      this.zoom = 1.0;
      this.panOffset = { x: 0, y: 0 };
      this.updateZoomDisplay();
      this.render();
    });

    // Save/Load
    document.getElementById('saveBtn').addEventListener('click', () => this.saveProject());
    document.getElementById('loadBtn').addEventListener('click', () => document.getElementById('loadInput').click());
    document.getElementById('loadInput').addEventListener('change', (e) => this.loadProject(e));

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => this.handleKeyDown(e));
  }

  switchStep(step) {
    document.querySelectorAll('.step-btn').forEach(btn => {
      btn.classList.remove('step-active');
      btn.classList.add('bg-slate-100', 'hover:bg-slate-200');
    });
    document.querySelector(`[data-step="${step}"]`).classList.add('step-active');
    document.querySelector(`[data-step="${step}"]`).classList.remove('bg-slate-100', 'hover:bg-slate-200');

    document.querySelectorAll('.step-panel').forEach(panel => panel.classList.add('hidden'));
    document.getElementById(`panel-${step}`).classList.remove('hidden');

    if (step === '2') {
      this.mode = 'place';
      this.updateModeIndicator('記号配置モード');
    } else if (step === '3') {
      this.mode = 'wire';
      this.updateModeIndicator('配線モード');
      this.selectedSymbolType = null;
      document.querySelectorAll('.symbol-btn').forEach(b => b.classList.remove('active'));
    } else if (step === '4') {
      this.mode = 'idle';
      this.updateModeIndicator('待機中');
    } else {
      this.mode = 'idle';
      this.updateModeIndicator('待機中');
    }
    this.render();
  }

  updateModeIndicator(text) {
    document.getElementById('modeIndicator').textContent = text;
  }

  loadImage(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        this.baseImage = img;
        this.canvas.width = Math.max(img.width, 1200);
        this.canvas.height = Math.max(img.height, 800);
        document.getElementById('imageControls').classList.remove('hidden');
        this.saveState();
        this.render();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  startPerspectiveMode() {
    this.isPerspectiveMode = true;
    this.perspectivePoints = [];
    document.getElementById('perspectiveHelp').classList.remove('hidden');
    document.getElementById('applyPerspectiveBtn').classList.add('hidden');
    this.updateModeIndicator('台形補正: 四隅をクリック');
  }

  applyPerspective() {
    if (this.perspectivePoints.length !== 4) return;
    
    const pts = this.perspectivePoints;
    const xs = pts.map(p => p.x);
    const ys = pts.map(p => p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const width = maxX - minX;
    const height = maxY - minY;
    
    // 簡易的な台形補正: 選択範囲をキャンバス全体に拡大
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = width;
    tempCanvas.height = height;
    const tempCtx = tempCanvas.getContext('2d');
    
    const srcCanvas = document.createElement('canvas');
    srcCanvas.width = this.baseImage.width;
    srcCanvas.height = this.baseImage.height;
    srcCanvas.getContext('2d').drawImage(this.baseImage, 0, 0);
    
    tempCtx.drawImage(srcCanvas, minX, minY, width, height, 0, 0, width, height);
    
    const correctedImg = new Image();
    correctedImg.onload = () => {
      this.baseImage = correctedImg;
      this.isPerspectiveMode = false;
      this.perspectivePoints = [];
      document.getElementById('perspectiveHelp').classList.add('hidden');
      document.getElementById('applyPerspectiveBtn').classList.add('hidden');
      this.saveState();
      this.render();
    };
    correctedImg.src = tempCanvas.toDataURL();
  }

  selectSymbol(type, btn) {
    document.querySelectorAll('.symbol-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    this.selectedSymbolType = type;
    this.isDeleteMode = false;
    document.getElementById('deleteModeBtn').classList.remove('bg-red-600', 'text-white');
  }

  toggleDeleteMode() {
    this.isDeleteMode = !this.isDeleteMode;
    const btn = document.getElementById('deleteModeBtn');
    if (this.isDeleteMode) {
      btn.classList.add('bg-red-600', 'text-white');
      this.selectedSymbolType = null;
      document.querySelectorAll('.symbol-btn').forEach(b => b.classList.remove('active'));
      this.updateModeIndicator('削除モード');
    } else {
      btn.classList.remove('bg-red-600', 'text-white');
      this.updateModeIndicator('記号配置モード');
    }
  }

  getCanvasPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    const scaleX = this.canvas.width / rect.width;
    const scaleY = this.canvas.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX / this.zoom - this.panOffset.x,
      y: (e.clientY - rect.top) * scaleY / this.zoom - this.panOffset.y
    };
  }

  handleMouseDown(e) {
    const pos = this.getCanvasPos(e);
    
    if (this.isPerspectiveMode) {
      if (this.perspectivePoints.length < 4) {
        this.perspectivePoints.push(pos);
        if (this.perspectivePoints.length === 4) {
          document.getElementById('applyPerspectiveBtn').classList.remove('hidden');
          this.updateModeIndicator('「補正を適用」をクリック');
        }
        this.render();
      }
      return;
    }

    if (this.mode === 'place' && this.selectedSymbolType && !this.isDeleteMode) {
      this.placeSymbol(pos);
    } else if (this.isDeleteMode) {
      this.deleteAtPosition(pos);
    } else if (this.mode === 'wire') {
      this.handleWireClick(pos);
    }
    
    this.isDragging = true;
    this.dragStart = pos;
  }

  handleMouseMove(e) {
    const pos = this.getCanvasPos(e);
    document.getElementById('coordsIndicator').textContent = `X: ${Math.round(pos.x)}, Y: ${Math.round(pos.y)}`;
    
    if (this.mode === 'wire' && this.tempWireStart) {
      this.render();
      this.drawTempWire(this.tempWireStart, pos);
    }
  }

  handleMouseUp(e) {
    this.isDragging = false;
  }

  handleTouchStart(e) {
    e.preventDefault();
    const touch = e.touches[0];
    this.handleMouseDown({ clientX: touch.clientX, clientY: touch.clientY });
  }

  handleTouchMove(e) {
    e.preventDefault();
    const touch = e.touches[0];
    this.handleMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
  }

  handleTouchEnd(e) {
    this.handleMouseUp(e);
  }

  placeSymbol(pos) {
    let { x, y } = pos;
    if (this.snapToGrid) {
      x = Math.round(x / this.gridSize) * this.gridSize;
      y = Math.round(y / this.gridSize) * this.gridSize;
    }
    
    this.symbols.push({
      type: this.selectedSymbolType,
      x, y,
      id: Date.now() + Math.random()
    });
    
    this.saveState();
    this.updatePartsCount();
    this.render();
  }

  deleteAtPosition(pos) {
    const threshold = 20;
    
    for (let i = this.symbols.length - 1; i >= 0; i--) {
      const sym = this.symbols[i];
      const dist = Math.hypot(sym.x - pos.x, sym.y - pos.y);
      if (dist < threshold) {
        this.symbols.splice(i, 1);
        this.saveState();
        this.updatePartsCount();
        this.render();
        return;
      }
    }
    
    for (let i = this.wires.length - 1; i >= 0; i--) {
      const wire = this.wires[i];
      if (this.pointToLineDistance(pos, wire.start, wire.end) < 10) {
        this.wires.splice(i, 1);
        this.saveState();
        this.render();
        return;
      }
    }
  }

  pointToLineDistance(pt, lineStart, lineEnd) {
    const A = pt.x - lineStart.x;
    const B = pt.y - lineStart.y;
    const C = lineEnd.x - lineStart.x;
    const D = lineEnd.y - lineStart.y;
    const dot = A * C + B * D;
    const lenSq = C * C + D * D;
    let param = -1;
    if (lenSq !== 0) param = dot / lenSq;
    let xx, yy;
    if (param < 0) {
      xx = lineStart.x;
      yy = lineStart.y;
    } else if (param > 1) {
      xx = lineEnd.x;
      yy = lineEnd.y;
    } else {
      xx = lineStart.x + param * C;
      yy = lineStart.y + param * D;
    }
    return Math.hypot(pt.x - xx, pt.y - yy);
  }

  handleWireClick(pos) {
    if (!this.tempWireStart) {
      let snapPos = this.autoSnapLine ? this.findDarkPixelNear(pos) : pos;
      this.tempWireStart = snapPos;
      document.getElementById('cancelWireBtn').classList.remove('hidden');
      this.updateModeIndicator('終点をクリック');
    } else {
      let snapPos = this.autoSnapLine ? this.findDarkPixelNear(pos) : pos;
      const lineType = document.getElementById('lineTypeSelect').value;
      this.wires.push({
        start: this.tempWireStart,
        end: snapPos,
        type: lineType,
        id: Date.now() + Math.random()
      });
      this.tempWireStart = null;
      document.getElementById('cancelWireBtn').classList.add('hidden');
      this.updateModeIndicator('配線モード');
      this.saveState();
      this.render();
    }
  }

  findDarkPixelNear(pos) {
    if (!this.baseImage) return pos;
    
    const searchRadius = 20;
    const imageData = this.ctx.getImageData(
      Math.max(0, pos.x - searchRadius),
      Math.max(0, pos.y - searchRadius),
      Math.min(searchRadius * 2, this.canvas.width - pos.x + searchRadius),
      Math.min(searchRadius * 2, this.canvas.height - pos.y + searchRadius)
    );
    
    let minDist = Infinity;
    let bestPos = pos;
    
    for (let dy = 0; dy < imageData.height; dy++) {
      for (let dx = 0; dx < imageData.width; dx++) {
        const idx = (dy * imageData.width + dx) * 4;
        const brightness = (imageData.data[idx] + imageData.data[idx + 1] + imageData.data[idx + 2]) / 3;
        if (brightness < 100) {
          const x = pos.x - searchRadius + dx;
          const y = pos.y - searchRadius + dy;
          const dist = Math.hypot(x - pos.x, y - pos.y);
          if (dist < minDist) {
            minDist = dist;
            bestPos = { x, y };
          }
        }
      }
    }
    
    return bestPos;
  }

  drawTempWire(start, end) {
    this.ctx.save();
    this.ctx.strokeStyle = '#3b82f6';
    this.ctx.lineWidth = 2;
    this.ctx.setLineDash([5, 5]);
    this.ctx.beginPath();
    this.ctx.moveTo(start.x, start.y);
    this.ctx.lineTo(end.x, end.y);
    this.ctx.stroke();
    this.ctx.restore();
  }

  setZoom(newZoom) {
    this.zoom = Math.max(0.1, Math.min(5, newZoom));
    this.updateZoomDisplay();
    this.render();
  }

  updateZoomDisplay() {
    document.getElementById('zoomLevel').textContent = Math.round(this.zoom * 100) + '%';
  }

  render() {
    this.ctx.save();
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.ctx.scale(this.zoom, this.zoom);
    this.ctx.translate(this.panOffset.x, this.panOffset.y);
    
    // Draw grid
    this.drawGrid();
    
    // Draw base image
    if (this.baseImage) {
      this.ctx.save();
      this.ctx.globalAlpha = this.imageOpacity;
      this.ctx.filter = `contrast(${this.imageContrast * 100}%)`;
      this.ctx.drawImage(this.baseImage, 0, 0);
      this.ctx.restore();
    }
    
    // Draw perspective points
    if (this.isPerspectiveMode && this.perspectivePoints.length > 0) {
      this.ctx.strokeStyle = '#ef4444';
      this.ctx.fillStyle = '#ef4444';
      this.ctx.lineWidth = 2;
      this.ctx.beginPath();
      this.perspectivePoints.forEach((pt, i) => {
        if (i === 0) this.ctx.moveTo(pt.x, pt.y);
        else this.ctx.lineTo(pt.x, pt.y);
        this.ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
        this.ctx.fill();
      });
      if (this.perspectivePoints.length === 4) this.ctx.closePath();
      this.ctx.stroke();
    }
    
    // Draw wires
    this.wires.forEach(wire => this.drawWire(wire));
    
    // Draw symbols
    this.symbols.forEach(sym => this.drawSymbol(sym));
    
    this.ctx.restore();
  }

  drawGrid() {
    if (!this.snapToGrid) return;
    this.ctx.strokeStyle = '#e2e8f0';
    this.ctx.lineWidth = 0.5;
    for (let x = 0; x < this.canvas.width; x += this.gridSize) {
      this.ctx.beginPath();
      this.ctx.moveTo(x, 0);
      this.ctx.lineTo(x, this.canvas.height);
      this.ctx.stroke();
    }
    for (let y = 0; y < this.canvas.height; y += this.gridSize) {
      this.ctx.beginPath();
      this.ctx.moveTo(0, y);
      this.ctx.lineTo(this.canvas.width, y);
      this.ctx.stroke();
    }
  }

  drawWire(wire) {
    this.ctx.save();
    this.ctx.strokeStyle = '#1e293b';
    this.ctx.lineWidth = 2;
    this.ctx.lineCap = 'round';
    
    if (wire.type === 'dashed') {
      this.ctx.setLineDash([10, 5]);
    } else if (wire.type === 'dotted') {
      this.ctx.setLineDash([2, 4]);
    } else {
      this.ctx.setLineDash([]);
    }
    
    this.ctx.beginPath();
    this.ctx.moveTo(wire.start.x, wire.start.y);
    this.ctx.lineTo(wire.end.x, wire.end.y);
    this.ctx.stroke();
    this.ctx.restore();
  }

  drawSymbol(sym) {
    this.ctx.save();
    this.ctx.strokeStyle = '#1e293b';
    this.ctx.fillStyle = '#1e293b';
    this.ctx.lineWidth = 2;
    this.ctx.lineCap = 'round';
    this.ctx.lineJoin = 'round';
    
    const x = sym.x, y = sym.y;
    const r = 12;
    
    switch(sym.type) {
      case 'outlet':
        this.ctx.beginPath();
        this.ctx.arc(x, y, r, 0, Math.PI * 2);
        this.ctx.stroke();
        this.ctx.beginPath();
        this.ctx.arc(x, y - 6, 2, 0, Math.PI * 2);
        this.ctx.fill();
        this.ctx.beginPath();
        this.ctx.arc(x, y + 6, 2, 0, Math.PI * 2);
        this.ctx.fill();
        break;
        
      case 'switch':
        this.ctx.beginPath();
        this.ctx.arc(x, y, r, 0, Math.PI * 2);
        this.ctx.stroke();
        this.ctx.beginPath();
        this.ctx.moveTo(x, y - r);
        this.ctx.lineTo(x + r * 0.7, y);
        this.ctx.stroke();
        break;
        
      case 'junction':
        this.ctx.beginPath();
        this.ctx.arc(x, y, r * 0.8, 0, Math.PI * 2);
        this.ctx.stroke();
        this.ctx.beginPath();
        this.ctx.moveTo(x - r * 0.6, y - r * 0.6);
        this.ctx.lineTo(x + r * 0.6, y + r * 0.6);
        this.ctx.moveTo(x + r * 0.6, y - r * 0.6);
        this.ctx.lineTo(x - r * 0.6, y + r * 0.6);
        this.ctx.stroke();
        break;
        
      case 'light':
        this.ctx.beginPath();
        this.ctx.arc(x, y, r, 0, Math.PI * 2);
        this.ctx.stroke();
        this.ctx.beginPath();
        this.ctx.moveTo(x - r * 0.7, y - r * 0.7);
        this.ctx.lineTo(x + r * 0.7, y + r * 0.7);
        this.ctx.moveTo(x + r * 0.7, y - r * 0.7);
        this.ctx.lineTo(x - r * 0.7, y + r * 0.7);
        this.ctx.stroke();
        this.ctx.beginPath();
        this.ctx.arc(x, y, r * 0.3, 0, Math.PI * 2);
        this.ctx.stroke();
        break;
        
      case 'panel':
        this.ctx.strokeRect(x - 20, y - 12, 40, 24);
        this.ctx.beginPath();
        this.ctx.moveTo(x - 10, y - 12);
        this.ctx.lineTo(x - 10, y + 12);
        this.ctx.moveTo(x, y - 12);
        this.ctx.lineTo(x, y + 12);
        this.ctx.moveTo(x + 10, y - 12);
        this.ctx.lineTo(x + 10, y + 12);
        this.ctx.stroke();
        break;
    }
    
    this.ctx.restore();
  }

  updatePartsCount() {
    const counts = {
      outlet: 0,
      switch: 0,
      junction: 0,
      light: 0,
      panel: 0
    };
    
    this.symbols.forEach(s => counts[s.type]++);
    
    const container = document.getElementById('partsCount');
    container.innerHTML = `
      <div class="flex justify-between"><span>コンセント</span><span>${counts.outlet}</span></div>
      <div class="flex justify-between"><span>スイッチ</span><span>${counts.switch}</span></div>
      <div class="flex justify-between"><span>JB</span><span>${counts.junction}</span></div>
      <div class="flex justify-between"><span>照明</span><span>${counts.light}</span></div>
      <div class="flex justify-between"><span>分電盤</span><span>${counts.panel}</span></div>
    `;
    
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    document.getElementById('totalCount').textContent = total;
  }

  saveState() {
    const state = {
      symbols: JSON.parse(JSON.stringify(this.symbols)),
      wires: JSON.parse(JSON.stringify(this.wires))
    };
    this.undoStack.push(state);
    if (this.undoStack.length > 50) this.undoStack.shift();
    this.redoStack = [];
  }

  handleKeyDown(e) {
    if (e.ctrlKey || e.metaKey) {
      if (e.key === 'z') {
        e.preventDefault();
        this.undo();
      } else if (e.key === 'y') {
        e.preventDefault();
        this.redo();
      }
    } else if (e.key === 'Delete' || e.key === 'Backspace') {
      // 選択削除は削除モードで実装済み
    } else if (e.key === 'Escape') {
      this.tempWireStart = null;
      document.getElementById('cancelWireBtn').classList.add('hidden');
      this.render();
    }
  }

  undo() {
    if (this.undoStack.length <= 1) return;
    const current = this.undoStack.pop();
    this.redoStack.push(current);
    const prev = this.undoStack[this.undoStack.length - 1];
    this.symbols = JSON.parse(JSON.stringify(prev.symbols));
    this.wires = JSON.parse(JSON.stringify(prev.wires));
    this.updatePartsCount();
    this.render();
  }

  redo() {
    if (this.redoStack.length === 0) return;
    const state = this.redoStack.pop();
    this.undoStack.push(state);
    this.symbols = JSON.parse(JSON.stringify(state.symbols));
    this.wires = JSON.parse(JSON.stringify(state.wires));
    this.updatePartsCount();
    this.render();
  }

  saveProject() {
    const data = {
      version: '1.0',
      symbols: this.symbols,
      wires: this.wires,
      canvasSize: { width: this.canvas.width, height: this.canvas.height }
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `配線図_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  loadProject(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const data = JSON.parse(event.target.result);
        this.symbols = data.symbols || [];
        this.wires = data.wires || [];
        if (data.canvasSize) {
          this.canvas.width = data.canvasSize.width;
          this.canvas.height = data.canvasSize.height;
        }
        this.updatePartsCount();
        this.saveState();
        this.render();
        alert('プロジェクトを読み込みました');
      } catch (err) {
        alert('ファイルの読み込みに失敗しました');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  generatePDF() {
    const paperSize = document.getElementById('paperSize').value;
    const orientation = document.getElementById('orientation').value;
    
    const pdf = new jsPDF({
      orientation: orientation,
      unit: 'mm',
      format: paperSize
    });
    
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 10;
    const contentWidth = pageWidth - margin * 2;
    const contentHeight = pageHeight - margin * 2 - 30; // 凡例スペース確保
    
    // 一時的に画像なしで描画
    const tempOpacity = this.imageOpacity;
    this.imageOpacity = 0;
    this.render();
    
    // Canvas を画像化
    const imgData = this.canvas.toDataURL('image/png');
    const imgAspect = this.canvas.width / this.canvas.height;
    const pageAspect = contentWidth / contentHeight;
    
    let drawWidth, drawHeight;
    if (imgAspect > pageAspect) {
      drawWidth = contentWidth;
      drawHeight = contentWidth / imgAspect;
    } else {
      drawHeight = contentHeight;
      drawWidth = contentHeight * imgAspect;
    }
    
    pdf.addImage(imgData, 'PNG', margin, margin, drawWidth, drawHeight);
    
    // 元に戻す
    this.imageOpacity = tempOpacity;
    this.render();
    
    // 凡例と部品表を追加
    const legendY = margin + drawHeight + 5;
    pdf.setFontSize(10);
    pdf.text('【記号凡例】 JIS C 0303準拠', margin, legendY);
    
    const counts = { outlet: 0, switch: 0, junction: 0, light: 0, panel: 0 };
    this.symbols.forEach(s => counts[s.type]++);
    
    pdf.setFontSize(8);
    let y = legendY + 5;
    const col1 = ['○ コンセント: ' + counts.outlet + '個', '○ スイッチ: ' + counts.switch + '個', '○ JB: ' + counts.junction + '個'];
    const col2 = ['○ 照明: ' + counts.light + '個', '○ 分電盤: ' + counts.panel + '個', '配線: ' + this.wires.length + '本'];
    
    col1.forEach((t, i) => pdf.text(t, margin, y + i * 4));
    col2.forEach((t, i) => pdf.text(t, margin + 50, y + i * 4));
    
    pdf.setFontSize(7);
    pdf.text(`作成日: ${new Date().toLocaleDateString('ja-JP')}`, pageWidth - margin - 30, pageHeight - 5);
    
    pdf.save(`配線図_${new Date().toISOString().split('T')[0]}.pdf`);
  }
}

new ElectricalDiagramEditor();
</script>
