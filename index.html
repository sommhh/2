<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>型番検索ツール</title>

<style>
:root { --primary:#4285f4; --secondary:#34a853; }

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#f8f9fa;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

.container{
  width:90%;
  max-width:400px;
  background:#fff;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  text-align:center;
}

h1{font-size:1.2rem;}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:1rem;
}

.btn{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:none;
  border-radius:12px;
  color:#fff;
  font-weight:bold;
}

.btn-paste{background:#666;}
.btn-manual{background:var(--primary);}
.btn-spec{background:var(--secondary);}

.info{
  font-size:0.8rem;
  color:#666;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">
<h1>📄 型番検索</h1>

<input id="modelInput" placeholder="ここに貼り付け or 自動取得">

<button class="btn btn-paste" onclick="smartPaste()">📋 自動取得</button>

<button class="btn btn-manual" onclick="doSearch('取扱説明書')">📖 取説</button>
<button class="btn btn-spec" onclick="doSearch('仕様書')">📑 仕様書</button>

<div class="info">
Android→自動取得OK<br>
iPhone→貼り付け推奨
</div>
</div>

<script>

// クリップボード対応判定
async function smartPaste(){
  const input = document.getElementById("modelInput");

  if (!navigator.clipboard) {
    alert("この端末は自動取得非対応です\n手動で貼り付けしてください");
    return;
  }

  try {
    const text = await navigator.clipboard.readText();

    if (!text) throw new Error();

    input.value = text;

  } catch (e) {
    alert("自動取得できませんでした\n長押し→貼り付けしてください");
  }
}


// 検索
function doSearch(type){
  const keyword = document.getElementById("modelInput").value.trim();

  if (!keyword){
    alert("型番が空です");
    return;
  }

  const query = encodeURIComponent(`${keyword} "${type}" filetype:pdf`);
  location.href = `https://www.google.com/search?q=${query}`;
}


// Androidは自動で試す（UX改善）
window.onload = async ()=>{
  try{
    if (navigator.clipboard){
      const text = await navigator.clipboard.readText();
      if(text) document.getElementById("modelInput").value = text;
    }
  }catch(e){}
}

</script>

</body>
</html>
