<script>

const map = L.map('map',{doubleClickZoom:false,zoomControl:true}).setView([35.681236,139.767125],18);

L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{
  attribution:'<a href="https://maps.gsi.go.jp/" target="_blank">国土地理院</a>',
  maxZoom:21, maxNativeZoom:18
}).addTo(map);

map.doubleClickZoom.disable();

const drawn = L.featureGroup().addTo(map);
const STORAGE_KEY='denryoku_pro_v12_data';

let activeTool=null, undoStack=[], currentLine=null, hikStart=null, bunkiStart=null, buildingPts=[], tempBuild=null;

// =========================
// 安全系ユーティリティ
// =========================
function safe(fn){
  try{ fn(); }catch(e){ console.error(e); }
}

// =========================
// UI
// =========================
function setActive(btn){
  document.querySelectorAll('#mapToolbar button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

document.getElementById('mapToolbar').addEventListener('click',e=>e.stopPropagation());

document.querySelectorAll('#mapToolbar button').forEach(b=>{
  b.addEventListener('click',()=>{
    activeTool=b.dataset.tool;
    setActive(b);
    currentLine=null; hikStart=null; bunkiStart=null;

    if(tempBuild){
      map.removeLayer(tempBuild);
      tempBuild=null;
    }
    buildingPts=[];
  });
});

// =========================
// Undo
// =========================
function addToUndo(l){
  drawn.addLayer(l);
  undoStack.push(l);
  return l;
}

// =========================
// ツール
// =========================
function addPole(latlng){
  addToUndo(L.circleMarker(latlng,{radius:9,color:'#000',weight:2.5,fillColor:'#fff',fillOpacity:1}));
}

function addTrans(latlng){
  addToUndo(L.circleMarker(latlng,{radius:9,color:'#dc2626',weight:2.5,fillColor:'#fff',fillOpacity:1}));
}

function handleTeiden(latlng){
  if(!currentLine){
    currentLine=L.polyline([latlng],{color:'#000',weight:3});
    addToUndo(currentLine);
  }else{
    currentLine.addLatLng(latlng);
  }
}

function handleHikikomi(latlng){
  if(!hikStart){
    hikStart=latlng;
    const temp = L.circleMarker(latlng,{radius:4,color:'#dc2626',fillColor:'#dc2626'}).addTo(map);

    setTimeout(()=>{
      if(map.hasLayer(temp)) map.removeLayer(temp);
    },800);
    return;
  }

  const line=L.polyline([hikStart,latlng],{color:'#dc2626',weight:3});
  addToUndo(line);

  const dist=map.distance(hikStart,latlng);
  const mid=L.latLng((hikStart.lat+latlng.lat)/2,(hikStart.lng+latlng.lng)/2);

  addToUndo(L.marker(mid,{
    icon:L.divIcon({className:'dist-label',html:`<span>${dist.toFixed(1)}m</span>`}),
    interactive:false
  }));

  hikStart=null;
}

function handleBunki(latlng){
  if(!bunkiStart){
    bunkiStart=latlng;
    const temp=L.circleMarker(latlng,{radius:5,color:'#f59e0b',fillColor:'#f59e0b'}).addTo(map);

    setTimeout(()=>{
      if(map.hasLayer(temp)) map.removeLayer(temp);
    },600);
    return;
  }

  addToUndo(L.polyline([bunkiStart,latlng],{
    color:'#dc2626',weight:2.5,dashArray:'6,6'
  }));

  bunkiStart=null;
}

function handleBuilding(latlng){
  buildingPts.push(latlng);

  if(tempBuild) map.removeLayer(tempBuild);

  tempBuild=L.polyline(buildingPts,{color:'#dc2626',dashArray:'5,5'}).addTo(map);
}

function finishBuilding(){
  if(buildingPts.length<3) return;

  if(tempBuild){
    map.removeLayer(tempBuild);
    tempBuild=null;
  }

  const poly=L.polygon(buildingPts,{
    color:'#dc2626',weight:4,dashArray:'10,6',fillOpacity:0.08
  });

  addToUndo(poly);

  buildingPts=[];
}

function handleText(latlng){
  const txt=prompt('テキストを入力');
  if(!txt) return;

  const safeTxt = txt.replace(/</g,'&lt;').replace(/>/g,'&gt;');

  addToUndo(L.marker(latlng,{
    icon:L.divIcon({className:'text-label',html:`<div>${safeTxt}</div>`})
  }));
}

// =========================
// MAPイベント
// =========================
map.on('click',e=>{
  if(!activeTool) return;

  const ll=e.latlng;

  safe(()=>{
    switch(activeTool){
      case 'pole': addPole(ll); break;
      case 'trans': addTrans(ll); break;
      case 'teiden': handleTeiden(ll); break;
      case 'hikikomi': handleHikikomi(ll); break;
      case 'bunki': handleBunki(ll); break;
      case 'building': handleBuilding(ll); break;
      case 'text': handleText(ll); break;
    }
  });
});

map.on('dblclick',()=>{
  if(activeTool==='teiden') currentLine=null;
  if(activeTool==='building') finishBuilding();
});

// =========================
// GPS（完全安定版）
// =========================
document.getElementById('btnGps').onclick=()=>{
  if(!navigator.geolocation){
    alert('GPS未対応');
    return;
  }

  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude;
    const lng=pos.coords.longitude;

    map.setView([lat,lng],19);

  },err=>{
    alert('位置取得失敗');
  },{timeout:10000});
};

// =========================
// PNG（失敗対策）
// =========================
document.getElementById('btnPng').onclick=()=>{
  html2canvas(document.querySelector('.map-wrap'),{useCORS:true,scale:2})
  .then(canvas=>{
    const a=document.createElement('a');
    a.href=canvas.toDataURL();
    a.download='map.png';
    a.click();
  })
  .catch(()=>{
    alert('PNG失敗');
  });
};

// =========================
// resize安定化
// =========================
setTimeout(()=>map.invalidateSize(),300);
window.addEventListener('resize',()=>map.invalidateSize());

</script>
