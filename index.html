<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電力申請用 位置図Pro v12.1 FIX</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
.app{display:flex;height:100%}
.sidebar{width:300px;background:#f8fafc;padding:10px;overflow:auto}
.map-wrap{flex:1;position:relative}
#map{width:100%;height:100%}
.toolbar{position:absolute;top:10px;left:10px;background:#fff;padding:6px;border-radius:6px;z-index:1000}
button{margin:2px}
</style>
</head>

<body>

<div class="app">

<div class="sidebar">
<input id="f_genba" placeholder="現場名"><br>
<input id="f_jusho" placeholder="住所"><br>
<button id="btnGps">GPS</button>
<button id="btnSave">保存</button>
<button id="btnLoad">読込</button>
<button id="btnPng">PNG</button>
</div>

<div class="map-wrap">
<div id="map"></div>

<div class="toolbar">
<button onclick="activeTool='pole'">電柱</button>
<button onclick="activeTool='trans'">トランス</button>
<button onclick="activeTool='teiden'">低圧線</button>
<button onclick="activeTool='building'">建物</button>
<button onclick="activeTool='text'">文字</button>
</div>

</div>
</div>

<script>

// ===== 初期化 =====
const map = L.map('map',{doubleClickZoom:false}).setView([35.681236,139.767125],18);

L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{
 maxZoom:21
}).addTo(map);

const drawn = L.featureGroup().addTo(map);

// ===== 状態 =====
let activeTool=null;
let currentLine=null;
let buildingPts=[];
let tempBuild=null;

// ===== 安全 =====
function safe(fn){try{fn()}catch(e){console.error(e)}}

// ===== ツール =====
function addPole(ll){
 drawn.addLayer(L.circleMarker(ll,{radius:9,color:'#000'}));
}

function addTrans(ll){
 drawn.addLayer(L.circleMarker(ll,{radius:9,color:'#dc2626'}));
}

function handleTeiden(ll){
 if(!currentLine){
  currentLine=L.polyline([ll],{color:'#000'}).addTo(drawn);
 }else{
  currentLine.addLatLng(ll);
 }
}

function handleBuilding(ll){
 buildingPts.push(ll);

 if(tempBuild) map.removeLayer(tempBuild);

 tempBuild=L.polyline(buildingPts,{dashArray:'5,5',color:'#dc2626'}).addTo(map);
}

function finishBuilding(){
 if(buildingPts.length<3) return;

 if(tempBuild) map.removeLayer(tempBuild);

 drawn.addLayer(L.polygon(buildingPts,{color:'#dc2626'}));
 buildingPts=[];
}

function handleText(ll){
 let t=prompt("テキスト");
 if(!t) return;
 t=t.replace(/</g,'&lt;').replace(/>/g,'&gt;');

 drawn.addLayer(L.marker(ll,{
  icon:L.divIcon({html:`<div>${t}</div>`})
 }));
}

// ===== イベント =====
map.on('click',e=>{
 if(!activeTool) return;

 safe(()=>{
  switch(activeTool){
   case 'pole':addPole(e.latlng);break;
   case 'trans':addTrans(e.latlng);break;
   case 'teiden':handleTeiden(e.latlng);break;
   case 'building':handleBuilding(e.latlng);break;
   case 'text':handleText(e.latlng);break;
  }
 });
});

map.on('dblclick',()=>{
 if(activeTool==='teiden') currentLine=null;
 if(activeTool==='building') finishBuilding();
});

// ===== GPS =====
btnGps.onclick=()=>{
 if(!navigator.geolocation) return alert("未対応");

 navigator.geolocation.getCurrentPosition(p=>{
  map.setView([p.coords.latitude,p.coords.longitude],19);
 },()=>alert("失敗"),{timeout:10000});
};

// ===== 保存 =====
btnSave.onclick=()=>{
 localStorage.setItem("data",JSON.stringify({
  form:{g:f_genba.value,j:f_jusho.value},
  draw:drawn.toGeoJSON()
 }));
 alert("保存OK");
};

// ===== 読込 =====
btnLoad.onclick=()=>{
 const d=JSON.parse(localStorage.getItem("data"));
 if(!d) return alert("なし");

 f_genba.value=d.form.g||"";
 f_jusho.value=d.form.j||"";

 drawn.clearLayers();
 L.geoJSON(d.draw).addTo(drawn);
};

// ===== PNG =====
btnPng.onclick=()=>{
 html2canvas(document.body,{useCORS:true})
 .then(c=>{
  const a=document.createElement('a');
  a.href=c.toDataURL();
  a.download="map.png";
  a.click();
 })
 .catch(()=>alert("PNG失敗"));
};

// ===== 安定 =====
setTimeout(()=>map.invalidateSize(),300);
window.addEventListener('resize',()=>map.invalidateSize());

</script>

</body>
</html>
