<script>// Playables SDK v1.0.0
// Game lifecycle bridge: rAF-based game-ready detection + event communication
(function() {
  'use strict';

  // Idempotency: skip if already initialized (e.g., server-side injection
  // followed by client-side inject-javascript via the Bloks webview component).
  if (window.playablesSDK) return;

  var HANDLER_NAME = 'playablesGameEventHandler';
  var ANDROID_BRIDGE_NAME = '_MetaPlayablesBridge';
  var RAF_FRAME_THRESHOLD = 3;

  var gameReadySent = false;
  var firstInteractionSent = false;
  var errorSent = false;
  var frameCount = 0;
  var originalRAF = window.requestAnimationFrame;

  // --- Transport Layer ---

  function hasIOSBridge() {
    return !!(window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers[HANDLER_NAME]);
  }

  function hasAndroidBridge() {
    return !!(window[ANDROID_BRIDGE_NAME] &&
              typeof window[ANDROID_BRIDGE_NAME].postEvent === 'function');
  }

  function isInIframe() {
    return !!(window.parent && window.parent !== window);
  }

  function sendEvent(eventName, payload) {
    var message = {
      type: eventName,
      payload: payload || {},
      timestamp: Date.now()
    };

    if (hasIOSBridge()) {
      try {
        window.webkit.messageHandlers[HANDLER_NAME].postMessage(message);
      } catch (e) { /* ignore */ }
      return;
    }

    if (hasAndroidBridge()) {
    try {
      var p = payload || {};
      p.__secureToken = window.__fbAndroidBridgeAuthToken || '';
      window[ANDROID_BRIDGE_NAME].postEvent(
        eventName,
        JSON.stringify(p)
      );
    } catch (e) { /* ignore */ }
    return;
  }

    if (isInIframe()) {
      try {
        window.parent.postMessage(message, '*');
      } catch (e) { /* ignore */ }
      return;
    }
  }

  // --- rAF Game-Ready Detection ---

  function onFrame() {
    if (gameReadySent) return;

    frameCount++;
    if (frameCount >= RAF_FRAME_THRESHOLD) {
      gameReadySent = true;
      sendEvent('game_ready', {
        frame_count: frameCount,
        detected_at: Date.now()
      });
      return;
    }

    originalRAF.call(window, onFrame);
  }

  if (originalRAF) {
    window.requestAnimationFrame = function(callback) {
      if (!gameReadySent) {
        return originalRAF.call(window, function(timestamp) {
          frameCount++;
          if (frameCount >= RAF_FRAME_THRESHOLD && !gameReadySent) {
            gameReadySent = true;
            sendEvent('game_ready', {
              frame_count: frameCount,
              detected_at: Date.now()
            });
          }
          callback(timestamp);
        });
      }
      return originalRAF.call(window, callback);
    };
  }

  // --- First User Interaction Detection ---

  function setupFirstInteractionDetection() {
    var events = ['touchstart', 'mousedown', 'keydown'];

    function onFirstInteraction() {
      if (firstInteractionSent) return;
      firstInteractionSent = true;
      sendEvent('user_interaction_start', null);

      for (var i = 0; i < events.length; i++) {
        document.removeEventListener(events[i], onFirstInteraction, true);
      }
    }

    for (var i = 0; i < events.length; i++) {
      document.addEventListener(events[i], onFirstInteraction, true);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupFirstInteractionDetection);
  } else {
    setupFirstInteractionDetection();
  }

  // --- Auto Error Capture ---

  window.addEventListener('error', function(event) {
    if (errorSent) return;
    errorSent = true;
    sendEvent('error', {
      message: event.message || 'Unknown error',
      source: event.filename || '',
      lineno: event.lineno || 0,
      colno: event.colno || 0,
      auto_captured: true
    });
  });

  window.addEventListener('unhandledrejection', function(event) {
    if (errorSent) return;
    errorSent = true;
    var reason = event.reason;
    sendEvent('error', {
      message: (reason instanceof Error) ? reason.message : String(reason),
      type: 'unhandled_promise_rejection',
      auto_captured: true
    });
  });

  // --- Public API ---

  window.playablesSDK = {
    complete: function(score) {
      sendEvent('game_ended', {
        score: score,
        completed: true
      });
    },

    error: function(message) {
      if (errorSent) return;
      errorSent = true;
      sendEvent('error', {
        message: message || 'Unknown error',
        auto_captured: false
      });
    },

    sendEvent: function(eventName, payload) {
      if (!eventName || typeof eventName !== 'string') return;
      sendEvent(eventName, payload);
    }
  };

  // Kick off rAF detection in case no game code calls rAF immediately
  if (originalRAF) {
    originalRAF.call(window, onFrame);
  }
})();</script>

html,body{height:100%; overscroll-behavior:none; -webkit-tap-highlight-color:transparent}
.leaflet-div-icon{background:transparent;border:0}
.pole-dot{width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pole-dot.black{border:3px solid #000}
.pole-dot.red{border:3px solid #e60012}
.pole-label{font-size:11px;font-weight:700;color:#111;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff;white-space:nowrap;text-align:center;margin-top:2px;line-height:1}
.text-marker div{font-weight:700;color:#e60012;font-size:14px;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff;white-space:nowrap}

<body class="bg-gray-100 text-gray-900 h-screen flex flex-col select-none">
<header class="bg-white/95 backdrop-blur border-b sticky top-0 z-[1000]">
  <div class="px-2 py-1.5 flex flex-wrap items-center gap-1.5">
    <h1 class="font-bold text-[15px] sm:text-base mr-1 whitespace-nowrap">電力申請用 位置図Pro v9</h1>
    <div class="flex flex-wrap gap-1">
      <button id="btnGps" class="px-2.5 py-1.5 rounded-lg border bg-white text-xs sm:text-[13px] active:bg-gray-100">📍GPS</button>
      <button id="btnLine" class="px-2.5 py-1.5 rounded-lg border bg-white text-xs sm:text-[13px] active:bg-gray-100">LINE</button>
      <button id="btnSave" class="px-2.5 py-1.5 rounded-lg border bg-white text-xs sm:text-[13px] active:bg-gray-100">保存</button>
      <button id="btnLoad" class="px-2.5 py-1.5 rounded-lg border bg-white text-xs sm:text-[13px] active:bg-gray-100">読込</button>
      <button id="btnUndo" class="px-2.5 py-1.5 rounded-lg border bg-white text-xs sm:text-[13px] active:bg-gray-100">戻る</button>
      <button id="btnClear" class="px-2.5 py-1.5 rounded-lg border bg-white text-xs sm:text-[13px] active:bg-gray-100">全消し</button>
      <button id="btnPng" class="px-2.5 py-1.5 rounded-lg border bg-white text-xs sm:text-[13px] active:bg-gray-100">PNG</button>
      <button id="btnToggleForm" class="px-2.5 py-1.5 rounded-lg border bg-blue-600 text-white text-xs sm:text-[13px]">フォーム</button>
    </div>
  </div>
</header>

<main class="flex-1 flex overflow-hidden relative">
  <!-- Map Area -->
  <div class="flex-1 flex flex-col min-w-0">
    <div class="bg-white border-b px-1.5 py-1.5 flex flex-wrap gap-1 items-center">
      <button data-tool="pole" class="tool px-3 py-1.5 rounded-lg border text-[13px] bg-white active:bg-gray-100"><span class="inline-block w-3 h-3 rounded-full border-2 border-black bg-white mr-1 align-middle"></span>電柱○</button>
      <button data-tool="trans" class="tool px-3 py-1.5 rounded-lg border text-[13px] bg-white active:bg-gray-100"><span class="inline-block w-3 h-3 rounded-full border-2 border-[#e60012] bg-white mr-1 align-middle"></span>トランス○</button>
      <button data-tool="lv" class="tool px-3 py-1.5 rounded-lg border text-[13px] bg-white active:bg-gray-100">低圧線</button>
      <button data-tool="svc" class="tool px-3 py-1.5 rounded-lg border text-[13px] bg-white active:bg-gray-100">引込線</button>
      <button data-tool="bld" class="tool px-3 py-1.5 rounded-lg border text-[13px] bg-white active:bg-gray-100">建物囲み</button>
      <button data-tool="text" class="tool px-3 py-1.5 rounded-lg border text-[13px] bg-white active:bg-gray-100">テキスト</button>
      <div class="ml-auto flex items-center gap-2">
        <span id="scale" class="text-[11px] text-gray-500"></span>
        <button id="btnLayer" class="px-2.5 py-1.5 rounded-lg border bg-white text-xs">🛰</button>
      </div>
    </div>
    <div id="map" class="flex-1 bg-gray-200"></div>
  </div>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed md:static inset-y-0 right-0 w-[310px] max-w-[88vw] bg-white border-l shadow-xl md:shadow-none z-[2000] translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col">
    <div class="h-12 flex items-center justify-between px-3 border-b shrink-0">
      <span class="font-semibold text-sm">申請情報</span>
      <button id="btnCloseForm" class="md:hidden px-2 py-1 text-xs border rounded">閉じる</button>
    </div>
    <div class="overflow-y-auto p-3 space-y-3 text-[13px] leading-5">
      <div>
        <label class="block text-[11px] text-gray-600 mb-0.5">現場名</label>
        <input id="fldSite" class="w-full border rounded-lg px-2.5 py-1.5" placeholder="〇〇邸新築">
      </div>
      <div>
        <label class="block text-[11px] text-gray-600 mb-0.5">住所（GPSで自動入力）</label>
        <input id="fldAddr" class="w-full border rounded-lg px-2.5 py-1.5" placeholder="住所">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[11px] text-gray-600 mb-0.5">工事種別</label>
          <select id="fldWork" class="w-full border rounded-lg px-2 py-1.5 bg-white">
            <option>本設</option><option>仮設</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] text-gray-600 mb-0.5">二類/三類</label>
          <select id="fldClass" class="w-full border rounded-lg px-2 py-1.5 bg-white">
            <option>二類</option><option>三類</option>
          </select>
        </div>
      <div>
        <label class="block text-[11px] text-gray-600 mb-0.5">供給区分</label>
        <input id="fldSupply" class="w-full border rounded-lg px-2.5 py-1.5" placeholder="単相3線 60A など">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[11px] text-gray-600 mb-0.5">外線種類</label>
          <select id="fldWireType" class="w-full border rounded-lg px-2 py-1.5 bg-white">
            <option>OW</option><option>DV</option><option>CV</option><option>CVT</option><option>その他</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] text-gray-600 mb-0.5">外線太さ</label>
          <select id="fldWireSize" class="w-full border rounded-lg px-2 py-1.5 bg-white">
            <option>2.0mm</option><option>2.6mm</option><option>3.2mm</option><option>5.0mm</option><option>8mm²</option><option>14mm²</option><option>22mm²</option><option>38mm²</option><option>60mm²</option><option>100mm²</option><option>その他</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[11px] text-gray-600 mb-0.5">受点完成日</label>
          <input id="fldComplete" type="date" class="w-full border rounded-lg px-2 py-1.5">
        </div>
        <div>
          <label class="block text-[11px] text-gray-600 mb-0.5">検査希望日</label>
          <input id="fldInspect" type="date" class="w-full border rounded-lg px-2 py-1.5">
        </div>
      </div>
      <div>
        <label class="block text-[11px] text-gray-600 mb-0.5">メーターBOX色</label>
        <select id="fldMeter" class="w-full border rounded-lg px-2 py-1.5 bg-white">
          <option>ベージュ</option><option>グレー</option><option>黒</option>
        </select>
      </div>
      <div>
        <label class="block text-[11px] text-gray-600 mb-0.5">備考</label>
        <textarea id="fldNote" rows="3" class="w-full border rounded-lg px-2.5 py-1.5" placeholder="特記事項"></textarea>
      </div>
      <div class="pt-2 border-t">
        <label class="block text-[11px] text-gray-600 mb-0.5">住所検索</label>
        <div class="flex gap-1.5">
          <input id="searchAddr" class="flex-1 border rounded-lg px-2.5 py-1.5" placeholder="地名・住所">
          <button id="btnSearch" class="px-3 py-1.5 rounded-lg bg-gray-900 text-white text-xs">検索</button>
        </div>
        <p class="text-[10px] text-gray-500 mt-1">GPSで住所自動入力します。検索でも補正可。</p>
      </div>
    </div>
  </aside>
  <div id="overlay" class="fixed inset-0 bg-black/30 z-[1500] hidden md:hidden"></div>
</main>

<div id="toast" class="toast"></div>

<script>
const $ = s=>document.querySelector(s);
const toast = (m)=>{ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); };

// Map
const map = L.map('map',{zoomControl:false,doubleClickZoom:false}).setView([35.681,139.767],17);
L.control.zoom({position:'bottomright'}).addTo(map);
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'©OpenStreetMap'}).addTo(map);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'©Esri'});
let base='osm';
$('#btnLayer').onclick=()=>{ if(base==='osm'){map.removeLayer(osm);sat.addTo(map);base='sat';}else{map.removeLayer(sat);osm.addTo(map);base='osm';} };

const drawn = L.featureGroup().addTo(map);
let historyStack=[]; let currentTool=null; let drawing=null;

function updateScale(){ const c=map.getCenter(); const mpp=156543.03392*Math.cos(c.lat*Math.PI/180)/Math.pow(2,map.getZoom()); $('#scale').textContent=`1px≈${mpp.toFixed(2)}m`; }
map.on('zoomend moveend',updateScale); updateScale();

function setTool(t){
  if(currentTool===t){ currentTool=null; } else { currentTool=t; }
  if(drawing && drawing.type==='lv'){ finishLv(); }
  document.querySelectorAll('.tool').forEach(b=>{
    const on=b.dataset.tool===currentTool;
    b.classList.toggle('bg-blue-600',on);
    b.classList.toggle('text-white',on);
    b.classList.toggle('border-blue-600',on);
  });
  map.getContainer().style.cursor = currentTool?'crosshair':'';
  if(currentTool==='lv') toast('低圧線: タップで追加。もう一度ボタンで終了');
  if(currentTool==='svc') toast('引込線: 始点→終点の順にタップ');
  if(currentTool==='bld') toast('建物囲み: 対角2点をタップ');
}
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));

function poleIcon(type,label){
  const cls = type==='trans'?'red':'black';
  const html = `<div style="display:flex;flex-direction:column;align-items:center;transform:translateY(-6px)"><div class="pole-dot ${cls}"></div><div class="pole-label">${label||''}</div></div>`;
  return L.divIcon({html,className:'leaflet-div-icon',iconSize:[30,34],iconAnchor:[15,13]});
}
function addPole(latlng,type){
  const isT = type==='trans';
  const cnt = drawn.getLayers().filter(l=>l._ptype===type).length+1;
  const def = (isT?'T':'P')+cnt;
  const label = prompt(isT?'トランス番号':'電柱番号', def);
  if(label===null) return;
  const m = L.marker(latlng,{draggable:true,icon:poleIcon(type,label),autoPan:true});
  m._ptype=type; m._label=label;
  m.on('click',()=>{ if(currentTool) return; const nl=prompt('名称変更',m._label); if(nl!==null){m._label=nl; m.setIcon(poleIcon(type,nl));}});
  drawn.addLayer(m); historyStack.push({act:'add',layer:m});
}
function finishLv(){
  if(drawing && drawing.type==='lv'){
    if(drawing.layer.getLatLngs().length<2){ drawn.removeLayer(drawing.layer); }
    else{ historyStack.push({act:'add',layer:drawing.layer}); }
  }
  drawing=null;
}
function addLvPoint(latlng){
  if(!drawing || drawing.type!=='lv'){
    const line = L.polyline([latlng],{color:'#000',weight:3});
    line.addTo(drawn);
    drawing={type:'lv',layer:line};
  }else{
    drawing.layer.addLatLng(latlng);
  }
}
function addSvc(latlng){
  if(!drawing || drawing.type!=='svc'){ drawing={type:'svc',p1:latlng}; toast('終点をタップ'); return; }
  const p2=latlng;
  const line = L.polyline([drawing.p1,p2],{color:'#e60012',weight:3});
  line.addTo(drawn);
  const d = map.distance(drawing.p1,p2);
  const mid = L.latLng((drawing.p1.lat+p2.lat)/2,(drawing.p1.lng+p2.lng)/2);
  const txt = L.marker(mid,{icon:L.divIcon({className:'text-marker',html:`<div>${d.toFixed(1)}m</div>`,iconSize:[70,18],iconAnchor:[35,9]}),interactive:false});
  txt.addTo(drawn);
  historyStack.push({act:'add',layer:line}); historyStack.push({act:'add',layer:txt});
  drawing=null; toast('引込線を作成');
}
function addBld(latlng){
  if(!drawing || drawing.type!=='bld'){ drawing={type:'bld',p1:latlng}; toast('対角点をタップ'); return; }
  const rect = L.rectangle(L.latLngBounds(drawing.p1,latlng),{color:'#2563eb',weight:2,fillOpacity:0.08});
  rect.addTo(drawn); historyStack.push({act:'add',layer:rect}); drawing=null;
}
function addText(latlng){
  const t = prompt('テキスト入力'); if(!t) return;
  const m = L.marker(latlng,{icon:L.divIcon({className:'text-marker',html:`<div>${t}</div>`,iconSize:[100,20],iconAnchor:[50,10]}),draggable:true});
  m._isText=true; drawn.addLayer(m); historyStack.push({act:'add',layer:m});
}

map.on('click',e=>{
  if(!currentTool) return;
  const ll=e.latlng;
  if(currentTool==='pole') addPole(ll,'pole');
  else if(currentTool==='trans') addPole(ll,'trans');
  else if(currentTool==='lv') addLvPoint(ll);
  else if(currentTool==='svc') addSvc(ll);
  else if(currentTool==='bld') addBld(ll);
  else if(currentTool==='text') addText(ll);
});

// GPS with reverse geocode
$('#btnGps').onclick=()=>{
  if(!navigator.geolocation){ toast('GPS未対応'); return; }
  toast('GPS取得中...');
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:lat,longitude:lon}=pos.coords;
    map.setView([lat,lon],19);
    L.circle([lat,lon],{radius:pos.coords.accuracy/2,color:'#3b82f6',weight:1,fillOpacity:0.15}).addTo(drawn);
    try{
      const url=`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=ja&zoom=18&addressdetails=1`;
      const r=await fetch(url,{headers:{'Accept':'application/json'}});
      const j=await r.json();
      const addr = j.display_name || (j.address?Object.values(j.address).reverse().join(' '):'');
      $('#fldAddr').value = addr.replace(/日本、?/, '');
      toast('住所を自動入力しました');
    }catch(e){ toast('住所取得失敗'); }
  }, err=>toast('GPSエラー'),{enableHighAccuracy:true,timeout:10000});
};

// Search
$('#btnSearch').onclick=async()=>{
  const q=$('#searchAddr').value.trim(); if(!q) return;
  try{
    const url=`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=jp&limit=1&accept-language=ja`;
    const r=await fetch(url); const js=await r.json();
    if(js[0]){ const {lat,lon,display_name}=js[0]; map.setView([lat,lon],19); $('#fldAddr').value=display_name.replace(/日本、?/,''); toast('移動しました'); }
    else toast('見つかりません');
  }catch{ toast('検索失敗'); }
};

// Undo / Clear
$('#btnUndo').onclick=()=>{
  finishLv();
  const h = historyStack.pop();
  if(h && h.layer){ drawn.removeLayer(h.layer); toast('戻しました'); }
};
$('#btnClear').onclick=()=>{ if(confirm('全て削除しますか？')){ drawn.clearLayers(); historyStack=[]; drawing=null; toast('全消去'); } };

// Save / Load
function collectForm(){ return { site:$('#fldSite').value, addr:$('#fldAddr').value, work:$('#fldWork').value, cls:$('#fldClass').value, supply:$('#fldSupply').value, wireT:$('#fldWireType').value, wireS:$('#fldWireSize').value, comp:$('#fldComplete').value, insp:$('#fldInspect').value, meter:$('#fldMeter').value, note:$('#fldNote').value }; }
function applyForm(f){ $('#fldSite').value=f.site||''; $('#fldAddr').value=f.addr||''; $('#fldWork').value=f.work||'本設'; $('#fldClass').value=f.cls||'二類'; $('#fldSupply').value=f.supply||''; $('#fldWireType').value=f.wireT||'OW'; $('#fldWireSize').value=f.wireS||'2.0mm'; $('#fldComplete').value=f.comp||''; $('#fldInspect').value=f.insp||''; $('#fldMeter').value=f.meter||'ベージュ'; $('#fldNote').value=f.note||''; }
function serialize(){
  const feats=[];
  drawn.eachLayer(l=>{
    if(l._ptype){ feats.push({t:l._ptype,lat:l.getLatLng().lat,lng:l.getLatLng().lng,lab:l._label}); }
    else if(l instanceof L.Polyline && !(l instanceof L.Rectangle)){ feats.push({t:'poly',color:l.options.color,pts:l.getLatLngs().map(p=>[p.lat,p.lng])}); }
    else if(l instanceof L.Rectangle){ const b=l.getBounds(); feats.push({t:'rect',b:[[b.getSouth(),b.getWest()],[b.getNorth(),b.getEast()]]}); }
    else if(l._isText || (l.options && l.options.icon && l.options.icon.options.className==='text-marker' && l.options.draggable)){ const txt=l.options.icon.options.html.replace(/<[^>]+>/g,''); feats.push({t:'text',lat:l.getLatLng().lat,lng:l.getLatLng().lng,txt}); }
    else if(l.options && l.options.icon.options.className==='text-marker'){ const txt=l.options.icon.options.html.replace(/<[^>]+>/g,''); feats.push({t:'mlabel',lat:l.getLatLng().lat,lng:l.getLatLng().lng,txt}); }
  });
  return {v:9,form:collectForm(),feats,center:map.getCenter(),zoom:map.getZoom()};
}
function deserialize(d){
  drawn.clearLayers(); historyStack=[];
  applyForm(d.form||{});
  (d.feats||[]).forEach(f=>{
    if(f.t==='pole'||f.t==='trans'){ const m=L.marker([f.lat,f.lng],{draggable:true,icon:poleIcon(f.t,f.lab)}); m._ptype=f.t; m._label=f.lab; m.on('click',()=>{ if(currentTool) return; const nl=prompt('名称変更',m._label); if(nl!==null){m._label=nl; m.setIcon(poleIcon(f.t,nl));}}); drawn.addLayer(m); }
    else if(f.t==='poly'){ const p=L.polyline(f.pts,{color:f.color||'#000',weight:3}); drawn.addLayer(p); }
    else if(f.t==='rect'){ const r=L.rectangle(f.b,{color:'#2563eb',weight:2,fillOpacity:0.08}); drawn.addLayer(r); }
    else if(f.t==='text'){ const m=L.marker([f.lat,f.lng],{draggable:true,icon:L.divIcon({className:'text-marker',html:`<div>${f.txt}</div>`,iconSize:[100,20],iconAnchor:[50,10]})}); m._isText=true; drawn.addLayer(m); }
    else if(f.t==='mlabel'){ const m=L.marker([f.lat,f.lng],{icon:L.divIcon({className:'text-marker',html:`<div>${f.txt}</div>`,iconSize:[70,18],iconAnchor:[35,9]}),interactive:false}); drawn.addLayer(m); }
  });
  if(d.center) map.setView(d.center,d.zoom||17);
}
$('#btnSave').onclick=()=>{ localStorage.setItem('posizu_v9',JSON.stringify(serialize())); toast('保存しました'); };
$('#btnLoad').onclick=()=>{ const s=localStorage.getItem('posizu_v9'); if(!s){toast('保存データなし');return;} try{deserialize(JSON.parse(s)); toast('読込完了');}catch{toast('読込失敗');} };

// PNG
$('#btnPng').onclick=async()=>{
  toast('画像作成中...');
  try{
    const el=$('#map');
    const canvas=await html2canvas(el,{useCORS:true,allowTaint:false,logging:false,backgroundColor:'#fff',scale:2});
    const a=document.createElement('a');
    a.href=canvas.toDataURL('image/png');
    const name = ($('#fldSite').value||'位置図').replace(/[\\/:*?"<>|]/g,'_');
    a.download=`${name}.png`; a.click(); toast('PNG保存');
  }catch(e){ toast('PNG作成失敗'); }
};

// LINE
$('#btnLine').onclick=()=>{
  const f=collectForm();
  const txt=[`【位置図】${f.site||''}`,`住所:${f.addr||''}`,`工事:${f.work}/${f.cls}`,`供給:${f.supply}`,`外線:${f.wireT} ${f.wireS}`,`受点:${f.comp} 検査:${f.insp}`,`メーター:${f.meter}`,f.note?`備考:${f.note}`:''].filter(Boolean).join('\n');
  window.open('https://line.me/R/msg/text/?'+encodeURIComponent(txt),'_blank');
};

// Sidebar toggle
const sidebar=$('#sidebar'), overlay=$('#overlay');
function openForm(on){ const show = on!==undefined?on:sidebar.classList.contains('translate-x-full'); sidebar.classList.toggle('translate-x-full',!show); overlay.classList.toggle('hidden',!show); setTimeout(()=>map.invalidateSize(),300); }
$('#btnToggleForm').onclick=()=>openForm();
$('#btnCloseForm').onclick=()=>openForm(false);
overlay.onclick=()=>openForm(false);
// Default: desktop show, mobile hide
if(window.innerWidth>=768){ openForm(true); } else { openForm(false); }

// Auto load last
window.addEventListener('load',()=>{ const s=localStorage.getItem('posizu_v9'); if(s){ try{deserialize(JSON.parse(s));}catch{} } });
</script>
