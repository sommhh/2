<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>位置図Pro 最強版</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body{margin:0;font-family:sans-serif}
header{background:#111;color:#fff;padding:6px;display:flex;gap:5px;flex-wrap:wrap}
button{padding:6px;border-radius:6px;border:0}
.primary{background:#2563eb;color:#fff}
#app{display:flex;height:calc(100vh - 40px)}
aside{width:260px;background:#f1f5f9;padding:8px;overflow:auto}
#map{flex:1}
.toolbar{position:absolute;top:5px;left:5px;background:#fff;padding:5px;z-index:1000}
.compass{position:absolute;top:5px;right:5px;background:#fff;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center}
</style>
</head>

<body>

<header>
<button id="gps" class="primary">GPS</button>
<button id="save">保存</button>
<button id="list">一覧</button>
<button id="load">読込</button>
<button id="undo">戻る</button>
<button id="clear">全消</button>
<button id="shot">📸</button>
<button id="print">印刷</button>
<button id="line">LINE</button>
</header>

<div id="app">
<aside>
<input id="genba" placeholder="現場名">
<input id="jusho" placeholder="住所">
</aside>

<div id="map">
<div class="toolbar">
<button data-m="pole">電柱</button>
<button data-m="trans">Tr</button>
<button data-m="house">🏠</button>
<button data-m="line">配線</button>
<button data-m="dist">距離</button>
</div>
<div class="compass" id="comp">↑</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);

const map=L.map('map',{doubleClickZoom:false}).setView([38.17,140.86],17);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

const drawn=L.featureGroup().addTo(map);

let mode='pole',hist=[],cur=null,d1=null;

// モード切替
document.querySelectorAll('[data-m]').forEach(b=>{
 b.onclick=()=>mode=b.dataset.m;
});

// アイコン
const icon=(txt,color)=>L.divIcon({
 html:`<div style="text-align:center">
 <div style="width:16px;height:16px;border-radius:50%;background:${color}"></div>
 <div style="font-size:10px">${txt}</div></div>`
});

// クリック処理
map.on('click',e=>{
 if(mode==='pole'||mode==='trans'){
  const n=prompt('番号'); if(!n)return;
  const m=L.marker(e.latlng,{icon:icon(n,mode==='trans'?'red':'black'),draggable:true}).addTo(drawn);
  m.k='p'; m.n=n; hist.push(m);
 }

 else if(mode==='house'){
  const m=L.marker(e.latlng,{icon:icon('家','green')}).addTo(drawn);
  m.k='h'; hist.push(m);
 }

 else if(mode==='line'){
  if(!cur){cur=L.polyline([e.latlng]).addTo(drawn);cur.k='l';hist.push(cur);}
  else cur.addLatLng(e.latlng);
 }

 else if(mode==='dist'){
  if(!d1)d1=e.latlng;
  else{
   const d=map.distance(d1,e.latlng);
   L.polyline([d1,e.latlng],{color:'red'}).addTo(drawn);
   alert("距離:"+Math.round(d)+"m");
   d1=null;
  }
 }
});

map.on('dblclick',()=>cur=null);

// GPS
$('gps').onclick=()=>{
 navigator.geolocation.getCurrentPosition(p=>{
  map.setView([p.coords.latitude,p.coords.longitude],19);
 });
};

// 保存
$('save').onclick=()=>{
 const data={
  genba:$('genba').value,
  jusho:$('jusho').value,
  layers:hist.map(l=>{
   if(l.k==='p')return{t:'p',lat:l.getLatLng().lat,lon:l.getLatLng().lng,n:l.n};
   if(l.k==='h')return{t:'h',lat:l.getLatLng().lat,lon:l.getLatLng().lng};
   if(l.k==='l')return{t:'l',pts:l.getLatLngs()};
  })
 };
 localStorage.setItem("MAP_"+data.genba,JSON.stringify(data));
 alert("保存OK");
};

// 一覧
$('list').onclick=()=>{
 let keys=Object.keys(localStorage).filter(k=>k.startsWith("MAP_"));
 alert(keys.join("\n"));
};

// 読込
$('load').onclick=()=>{
 const k=prompt("現場名");
 const d=JSON.parse(localStorage.getItem("MAP_"+k));
 if(!d)return;

 drawn.clearLayers(); hist=[];
 d.layers.forEach(o=>{
  if(o.t==='p'){
   const m=L.marker([o.lat,o.lon],{icon:icon(o.n,'black')}).addTo(drawn);
   m.k='p'; m.n=o.n; hist.push(m);
  }
  if(o.t==='h'){
   const m=L.marker([o.lat,o.lon],{icon:icon('家','green')}).addTo(drawn);
   m.k='h'; hist.push(m);
  }
  if(o.t==='l'){
   const l=L.polyline(o.pts).addTo(drawn);
   l.k='l'; hist.push(l);
  }
 });
};

// undo
$('undo').onclick=()=>{
 const l=hist.pop();
 if(l)drawn.removeLayer(l);
};

// clear
$('clear').onclick=()=>{
 if(confirm("消す？")){
  drawn.clearLayers();hist=[];
 }
};

// スクショ
$('shot').onclick=()=>{
 html2canvas(document.body).then(c=>{
  const a=document.createElement('a');
  a.href=c.toDataURL();
  a.download="map.png";
  a.click();
 });
};

// 印刷
$('print').onclick=()=>window.print();

// LINE
$('line').onclick=()=>{
 const c=map.getCenter();
 const txt=`${$('genba').value}
${$('jusho').value}
https://maps.google.com/?q=${c.lat},${c.lng}`;
 location.href='https://line.me/R/msg/text/?'+encodeURIComponent(txt);
};

// コンパス
window.addEventListener("deviceorientation",e=>{
 const d=e.alpha;
 $('comp').style.transform=`rotate(${d}deg)`;
});
</script>

</body>
</html>
