<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>電材スキャンPRO 安定版</title>
<style>
:root{
  --bg:#101418;
  --card:#1b2229;
  --card2:#24303a;
  --text:#fff;
  --muted:#b0bec5;
  --green:#00c853;
  --blue:#2962ff;
  --red:#d50000;
  --line:#06c755;
  --gray:#546e7a;
  --border:#31414d;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;
}
.wrap{
  max-width:920px;
  margin:auto;
  padding:12px;
}
h1{
  margin:8px 0 14px;
  font-size:22px;
  text-align:center;
}
.card{
  background:var(--card);
  border-radius:14px;
  padding:12px;
  margin:10px 0;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
}
.title{
  font-size:18px;
  font-weight:700;
  margin-bottom:10px;
}
.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.col{
  flex:1 1 220px;
}
input, textarea{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0f151a;
  color:#fff;
  font-size:16px;
  outline:none;
}
textarea{
  min-height:90px;
  resize:vertical;
}
button, .btn{
  width:100%;
  padding:13px 12px;
  border:none;
  border-radius:10px;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  text-align:center;
}
button:active, .btn:active{
  transform:scale(0.98);
  opacity:.92;
}
button:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.btn-green{background:var(--green)}
.btn-blue{background:var(--blue)}
.btn-red{background:var(--red)}
.btn-line{background:var(--line)}
.btn-gray{background:var(--gray)}
video{
  width:100%;
  max-height:52vh;
  background:#000;
  border-radius:12px;
  margin-top:10px;
}
.small{
  font-size:12px;
  color:var(--muted);
}
.status{
  margin-top:8px;
  min-height:20px;
  font-size:14px;
  font-weight:700;
  color:#90caf9;
}
.links{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:8px;
}
.links a{
  display:block;
  background:var(--blue);
  color:#fff;
  text-decoration:none;
  text-align:center;
  padding:11px;
  border-radius:10px;
  font-weight:700;
}
.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.item{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  transition:background-color .35s ease, box-shadow .35s ease, border-color .35s ease;
}
.item.flash{
  background:#124d2f;
  border-color:#69f0ae;
  box-shadow:0 0 0 2px rgba(105,240,174,.25), 0 0 18px rgba(105,240,174,.18);
}
.item-code{
  font-size:16px;
  font-weight:700;
  word-break:break-all;
}
.item-meta{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  white-space:pre-wrap;
}
.item-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:8px;
}
.item-actions button,.item-actions a{
  width:auto;
  padding:8px 10px;
  font-size:13px;
}
.badge{
  display:inline-block;
  background:#37474f;
  color:#fff;
  border-radius:999px;
  padding:4px 8px;
  font-size:12px;
}
.order-preview{
  white-space:pre-wrap;
  background:#0f151a;
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  line-height:1.6;
  font-size:14px;
}
.suggest-wrap{
  margin-top:10px;
}
.suggest-chip{
  display:inline-block;
  background:#37474f;
  color:#fff;
  padding:8px 10px;
  border-radius:999px;
  margin:4px 4px 0 0;
  font-size:13px;
  cursor:pointer;
}
.mt8{margin-top:8px}
.mt10{margin-top:10px}
@media (max-width:640px){
  .links{grid-template-columns:1fr}
}
@media print{
  body{background:#fff;color:#000}
  .no-print{display:none !important}
  .card,.item,.order-preview{
    background:#fff;
    color:#000;
    box-shadow:none;
    border:1px solid #ccc;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <h1>電材スキャンPRO 安定版</h1>

  <div class="card no-print">
    <div class="title">読取・入力</div>

    <div class="row">
      <div class="col">
        <input id="manual" placeholder="品番を入力またはスキャン">
      </div>
      <div class="col">
        <button class="btn-green" id="addManualBtn">手入力を追加</button>
      </div>
    </div>

    <div class="row mt8">
      <div class="col"><button class="btn-green" id="startBtn">カメラ起動</button></div>
      <div class="col"><button class="btn-blue" id="scanBtn">スキャン</button></div>
      <div class="col"><button class="btn-gray" id="stopBtn">停止</button></div>
    </div>

    <div class="small mt8">候補の「この候補を使う」を押すと、そのまま現在リストへ追加されます。</div>

    <video id="video" autoplay playsinline muted></video>
    <div class="status" id="status"></div>

    <div id="ocrBox" class="mt10" style="display:none;">
      <div class="small">スキャン候補</div>
      <div class="list" id="ocrCandidates"></div>
    </div>

    <div id="linksBox" class="mt10" style="display:none;">
      <div class="small">検索リンク</div>
      <div class="links" id="links"></div>
    </div>

    <div class="suggest-wrap">
      <div class="small">よく使う候補</div>
      <div id="suggestions"></div>
    </div>
  </div>

  <div class="card">
    <div class="title">現在の追加リスト</div>
    <div><span class="badge" id="currentCount">0件</span></div>
    <div class="list mt8" id="currentList"></div>
    <div class="row no-print mt8">
      <div class="col"><button class="btn-red" id="clearCurrentBtn">現在リスト全削除</button></div>
    </div>
  </div>

  <div class="card">
    <div class="title">注文情報</div>
    <div class="row">
      <div class="col"><input id="companyName" placeholder="会社名"></div>
      <div class="col"><input id="personName" placeholder="担当者"></div>
    </div>
    <div class="row mt8">
      <div class="col"><textarea id="remarks" placeholder="備考"></textarea></div>
    </div>
    <div class="row no-print mt8">
      <div class="col"><button class="btn-blue" id="buildOrderBtn">注文文を作成</button></div>
      <div class="col"><button class="btn-green" id="saveHistoryBtn">履歴として保存</button></div>
    </div>
    <div class="order-preview mt8" id="orderPreview">ここに注文文が表示されます。</div>
    <div class="row no-print mt8">
      <div class="col"><button class="btn-green" id="copyBtn">注文文をコピー</button></div>
      <div class="col"><a class="btn btn-line" id="lineBtn" href="#" target="_blank" rel="noopener">LINEで共有</a></div>
      <div class="col"><button class="btn-gray" id="printBtn">印刷</button></div>
    </div>
  </div>

  <div class="card">
    <div class="title">保存履歴</div>
    <div><span class="badge" id="historyCount">0件</span></div>
    <div class="list mt8" id="historyList"></div>
    <div class="row no-print mt8">
      <div class="col"><button class="btn-red" id="clearHistoryBtn">履歴を全削除</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(() => {
  "use strict";

  const PRODUCTS = [
    // Panasonic
    { code:"WTF1502WK", name:"コスモシリーズワイド21 埋込ダブルコンセント", maker:"Panasonic", category:"配線器具", aliases:["WTF1502","WTFI502WK","WTF-1502WK"] },
    { code:"WT50519", name:"コスモシリーズワイド21 埋込ほたるスイッチB", maker:"Panasonic", category:"配線器具", aliases:["WT5051","WT5O519","WT-50519"] },
    { code:"WTA5051", name:"アドバンスシリーズ スイッチ", maker:"Panasonic", category:"配線器具", aliases:["WTA5O51","WTA-5051"] },
    { code:"WTA3700K", name:"アドバンスシリーズ プレート", maker:"Panasonic", category:"配線器具", aliases:["WTA37O0K","WTA-3700K"] },
    { code:"WN5001", name:"埋込コンセント", maker:"Panasonic", category:"配線器具", aliases:["WN5OO1","WN-5001"] },
    { code:"WN6001W", name:"モダンプレート", maker:"Panasonic", category:"配線器具", aliases:["WN6OO1W","WN-6001W"] },
    { code:"WK3001W", name:"防雨スイッチ", maker:"Panasonic", category:"配線器具", aliases:["WK3OO1W","WK-3001W"] },
    { code:"WK4102K", name:"防雨コンセント", maker:"Panasonic", category:"配線器具", aliases:["WK41O2K","WK-4102K"] },
    { code:"WTC7101W", name:"コスモシリーズワイド21 スイッチプレート 1連用", maker:"Panasonic", category:"プレート", aliases:["WTC7101","WTC-7101W"] },
    { code:"WTC7102W", name:"コスモシリーズワイド21 スイッチプレート 2連用", maker:"Panasonic", category:"プレート", aliases:["WTC7102","WTC-7102W"] },
    { code:"WTC7103W", name:"コスモシリーズワイド21 スイッチプレート 3連用", maker:"Panasonic", category:"プレート", aliases:["WTC7103","WTC-7103W"] },
    { code:"WTF7003W", name:"コスモシリーズワイド21 コンセントプレート 3コ用", maker:"Panasonic", category:"プレート", aliases:["WTF7003","WTF-7003W"] },
    { code:"WTF7002W", name:"コスモシリーズワイド21 コンセントプレート 2コ用", maker:"Panasonic", category:"プレート", aliases:["WTF7002","WTF-7002W"] },
    { code:"WTF7001W", name:"コスモシリーズワイド21 コンセントプレート 1コ用", maker:"Panasonic", category:"プレート", aliases:["WTF7001","WTF-7001W"] },

    // 未来工業
    { code:"PF-16", name:"PF管 16", maker:"未来工業", category:"配管部材", aliases:["PF16","PF-I6","PF 16"] },
    { code:"PF-22", name:"PF管 22", maker:"未来工業", category:"配管部材", aliases:["PF22","PF-2Z","PF 22"] },
    { code:"VE-16", name:"VE管 16", maker:"未来工業", category:"配管部材", aliases:["VE16","VE-I6","VE 16"] },
    { code:"VE-22", name:"VE管 22", maker:"未来工業", category:"配管部材", aliases:["VE22","VE-2Z","VE 22"] },
    { code:"MFS-16", name:"モール付属品 16", maker:"未来工業", category:"モール部材", aliases:["MFS16","MFS-I6","MFS 16"] },
    { code:"MFS-22", name:"モール付属品 22", maker:"未来工業", category:"モール部材", aliases:["MFS22","MFS-2Z","MFS 22"] },
    { code:"PVP-28J", name:"プールボックス", maker:"未来工業", category:"配管部材", aliases:["PVP28J","PVP-28J","PVP 28J"] },
    { code:"PVK-BNJ", name:"ボックス", maker:"未来工業", category:"ボックス", aliases:["PVKBNJ","PVK-BN-J"] },
    { code:"SB", name:"スライドボックス", maker:"未来工業", category:"ボックス", aliases:["SLIDEBOX","スライドBOX"] },

    // JIMBO
    { code:"NKSERIES", name:"NKシリーズ", maker:"JIMBO", category:"配線器具", aliases:["NK","JIMBO NK","神保 NK"] },
    { code:"JEC-BN-55", name:"配線器具", maker:"JIMBO", category:"配線器具", aliases:["JECBN55","JEC-BN55"] },
    { code:"NKW01008", name:"スイッチ", maker:"JIMBO", category:"配線器具", aliases:["NKW-01008","NKWO1008"] },

    // テンパール
    { code:"B-1EA", name:"安全ブレーカ", maker:"テンパール", category:"ブレーカ", aliases:["B1EA","B-IEA"] },
    { code:"GB-1ZA", name:"漏電遮断器", maker:"テンパール", category:"ブレーカ", aliases:["GB1ZA","GB-IZA"] },
    { code:"MAG310182", name:"住宅分電盤", maker:"テンパール", category:"分電盤", aliases:["MAG-310182","MAG3I0I82"] }
  ];

  const STORAGE_KEYS = {
    current: "denzai_current_stable_v2",
    history: "denzai_history_stable_v2",
    freq: "denzai_freq_stable_v2"
  };

  const $ = id => document.getElementById(id);

  const els = {
    manual: $("manual"),
    addManualBtn: $("addManualBtn"),
    video: $("video"),
    status: $("status"),
    ocrBox: $("ocrBox"),
    ocrCandidates: $("ocrCandidates"),
    linksBox: $("linksBox"),
    links: $("links"),
    suggestions: $("suggestions"),
    currentList: $("currentList"),
    currentCount: $("currentCount"),
    companyName: $("companyName"),
    personName: $("personName"),
    remarks: $("remarks"),
    orderPreview: $("orderPreview"),
    lineBtn: $("lineBtn"),
    historyList: $("historyList"),
    historyCount: $("historyCount"),
    startBtn: $("startBtn"),
    scanBtn: $("scanBtn"),
    stopBtn: $("stopBtn"),
    buildOrderBtn: $("buildOrderBtn"),
    saveHistoryBtn: $("saveHistoryBtn"),
    copyBtn: $("copyBtn"),
    printBtn: $("printBtn"),
    clearCurrentBtn: $("clearCurrentBtn"),
    clearHistoryBtn: $("clearHistoryBtn")
  };

  let stream = null;
  let worker = null;
  let currentScanCandidates = [];
  let isScanning = false;

  function load(key, fallback){
    try{
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    }catch(e){
      return fallback;
    }
  }

  function save(key, value){
    localStorage.setItem(key, JSON.stringify(value));
  }

  function nowIso(){
    return new Date().toISOString();
  }

  function formatDate(iso){
    const d = new Date(iso);
    if(isNaN(d)) return "";
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    return y + "/" + m + "/" + day + " " + hh + ":" + mm;
  }

  function escapeHtml(str){
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function normalizeCode(str){
    return String(str || "")
      .toUpperCase()
      .replace(/[　\s]+/g, "")
      .replace(/[^A-Z0-9\-_/.\u30FC]/g, "");
  }

  function normalizeLoose(str){
    return normalizeCode(str).replace(/[-_/.\u30FC]/g, "");
  }

  function setStatus(msg, type){
    els.status.textContent = msg || "";
    els.status.style.color =
      type === "success" ? "#69f0ae" :
      type === "error" ? "#ff8a80" :
      "#90caf9";
  }

  function scoreCode(code){
    let s = 0;
    if(code.length >= 4) s += 2;
    if(code.length >= 6) s += 2;
    if(/[A-Z]/.test(code)) s += 3;
    if(/\d/.test(code)) s += 3;
    if(/[-/.]/.test(code)) s += 2;
    if(/^[A-Z0-9\-/.]+$/.test(code)) s += 2;
    if(/^[0-9]+$/.test(code)) s -= 3;
    if(code.length > 24) s -= 2;
    return s;
  }

  function extractCodes(text){
    const raw = (String(text || "").toUpperCase().match(/[A-Z0-9][A-Z0-9\-/.]{2,24}/g) || []);
    const cleaned = raw
      .map(v => v.replace(/^[\-/.]+|[\-/.]+$/g, ""))
      .filter(v => v.length >= 3);
    return Array.from(new Set(cleaned)).sort((a, b) => scoreCode(b) - scoreCode(a));
  }

  function fixCommonOcrErrors(code){
    const p = normalizeCode(code);
    const arr = [
      p,
      p.replace(/I/g, "1"),
      p.replace(/O/g, "0"),
      p.replace(/S/g, "5"),
      p.replace(/B/g, "8"),
      p.replace(/Z/g, "2"),
      p.replace(/Q/g, "0")
    ];
    return arr.filter((v, i, a) => v && a.indexOf(v) === i);
  }

  function levenshtein(a, b){
    const m = a.length;
    const n = b.length;
    const dp = [];
    for(let i = 0; i <= m; i++){
      dp[i] = [];
      for(let j = 0; j <= n; j++) dp[i][j] = 0;
    }
    for(let i = 0; i <= m; i++) dp[i][0] = i;
    for(let j = 0; j <= n; j++) dp[0][j] = j;

    for(let i = 1; i <= m; i++){
      for(let j = 1; j <= n; j++){
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        dp[i][j] = Math.min(
          dp[i - 1][j] + 1,
          dp[i][j - 1] + 1,
          dp[i - 1][j - 1] + cost
        );
      }
    }
    return dp[m][n];
  }

  function matchProducts(input){
    const variants = fixCommonOcrErrors(input);
    const results = [];

    for(let i = 0; i < PRODUCTS.length; i++){
      const p = PRODUCTS[i];
      const code = normalizeCode(p.code);
      const looseCode = normalizeLoose(code);
      let bestScore = 0;

      for(let j = 0; j < variants.length; j++){
        const v = variants[j];
        const looseV = normalizeLoose(v);

        if(v === code) bestScore = Math.max(bestScore, 100);
        else if(looseV === looseCode) bestScore = Math.max(bestScore, 95);
        else if(code.indexOf(v) === 0 || v.indexOf(code) === 0) bestScore = Math.max(bestScore, 88);
        else if(looseCode.indexOf(looseV) >= 0 || looseV.indexOf(looseCode) >= 0) bestScore = Math.max(bestScore, 82);
        else{
          const dist = levenshtein(looseV, looseCode);
          const maxLen = Math.max(looseV.length, looseCode.length) || 1;
          const sim = Math.round((1 - dist / maxLen) * 100);
          if(sim >= 60) bestScore = Math.max(bestScore, sim);
        }

        if(Array.isArray(p.aliases)){
          for(let k = 0; k < p.aliases.length; k++){
            const a = normalizeCode(p.aliases[k]);
            const la = normalizeLoose(a);
            if(v === a) bestScore = Math.max(bestScore, 93);
            else if(looseV === la) bestScore = Math.max(bestScore, 90);
          }
        }
      }

      if(bestScore >= 60){
        results.push({
          code: p.code,
          name: p.name,
          maker: p.maker,
          category: p.category,
          score: bestScore
        });
      }
    }

    return results.sort((a, b) => b.score - a.score).slice(0, 5);
  }

  function getBestProductInfo(code){
    const matches = matchProducts(code);
    if(matches.length) return matches[0];

    for(let i = 0; i < PRODUCTS.length; i++){
      if(normalizeCode(PRODUCTS[i].code) === normalizeCode(code)) return PRODUCTS[i];
    }
    return null;
  }

  async function getWorker(){
    if(worker) return worker;

    setStatus("OCR準備中...");
    worker = await Tesseract.createWorker("eng");
    await worker.setParameters({
      tessedit_pageseg_mode: "7",
      tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_/.",
      preserve_interword_spaces: "1",
      load_system_dawg: "0",
      load_freq_dawg: "0",
      user_defined_dpi: "300"
    });
    return worker;
  }

  async function startCamera(){
    try{
      stopCamera();
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });
      els.video.srcObject = stream;
      await els.video.play();
      setStatus("カメラ起動中");
    }catch(e){
      console.error(e);
      setStatus("カメラ起動失敗", "error");
      alert("カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。");
    }
  }

  function stopCamera(){
    if(stream){
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    els.video.srcObject = null;
    setStatus("カメラ停止");
  }

  function captureFrame(){
    const canvas = document.createElement("canvas");
    canvas.width = els.video.videoWidth;
    canvas.height = els.video.videoHeight;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(els.video, 0, 0);
    return canvas;
  }

  function cropCenter(canvas){
    const w = canvas.width;
    const h = canvas.height;
    const cw = Math.floor(w * 0.78);
    const ch = Math.floor(h * 0.24);
    const x = Math.floor((w - cw) / 2);
    const y = Math.floor((h - ch) / 2);

    const out = document.createElement("canvas");
    out.width = cw;
    out.height = ch;
    const ctx = out.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(canvas, x, y, cw, ch, 0, 0, cw, ch);
    return out;
  }

  function cropUpper(canvas){
    const w = canvas.width;
    const h = canvas.height;
    const cw = Math.floor(w * 0.78);
    const ch = Math.floor(h * 0.24);
    const x = Math.floor((w - cw) / 2);
    const y = Math.max(0, Math.floor(h * 0.34 - ch / 2));

    const out = document.createElement("canvas");
    out.width = cw;
    out.height = ch;
    const ctx = out.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(canvas, x, y, cw, ch, 0, 0, cw, ch);
    return out;
  }

  function upscale(canvas, scale){
    const s = scale || 2;
    const out = document.createElement("canvas");
    out.width = canvas.width * s;
    out.height = canvas.height * s;
    const ctx = out.getContext("2d", { willReadFrequently: true });
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(canvas, 0, 0, out.width, out.height);
    return out;
  }

  function preprocess(canvas, mode){
    const out = document.createElement("canvas");
    out.width = canvas.width;
    out.height = canvas.height;
    const ctx = out.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(canvas, 0, 0);

    const img = ctx.getImageData(0, 0, out.width, out.height);
    const d = img.data;

    for(let i = 0; i < d.length; i += 4){
      let g = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;

      if(mode === "strong"){
        g = (g - 128) * 2.2 + 128;
        g = g > 145 ? 255 : g < 100 ? 0 : g;
      }else{
        g = (g - 128) * 1.8 + 128;
        g = g > 155 ? 255 : g < 105 ? 0 : g;
      }

      d[i] = d[i + 1] = d[i + 2] = Math.max(0, Math.min(255, g));
    }

    ctx.putImageData(img, 0, 0);
    return out;
  }

  async function recognizeCanvas(targetCanvas){
    const w = await getWorker();
    const ret = await w.recognize(targetCanvas);
    return {
      text: ret && ret.data && ret.data.text ? ret.data.text : "",
      confidence: ret && ret.data && typeof ret.data.confidence === "number" ? ret.data.confidence : 0
    };
  }

  async function scan(){
    if(isScanning) return;

    if(!els.video.videoWidth){
      alert("先にカメラを起動してください");
      return;
    }

    isScanning = true;
    els.scanBtn.disabled = true;
    setStatus("読取中...");
    els.ocrBox.style.display = "none";

    try{
      const full = captureFrame();

      const pass1 = preprocess(upscale(cropCenter(full), 2), "normal");
      const pass2 = preprocess(upscale(cropUpper(full), 2), "strong");

      const results = [];

      setStatus("読取中... 1/2");
      results.push(await recognizeCanvas(pass1));

      setStatus("読取中... 2/2");
      results.push(await recognizeCanvas(pass2));

      const tally = {};

      for(let i = 0; i < results.length; i++){
        const r = results[i];
        const codes = extractCodes(r.text);

        for(let j = 0; j < codes.length; j++){
          const code = normalizeCode(codes[j]);
          if(!code) continue;

          let weight = scoreCode(code);
          weight += Math.max(0, Math.min(20, r.confidence / 5));

          const matched = matchProducts(code);
          if(matched.length) weight += 12;

          tally[code] = (tally[code] || 0) + weight;
        }
      }

      currentScanCandidates = Object.entries(tally)
        .sort((a, b) => b[1] - a[1])
        .map(v => v[0])
        .slice(0, 8);

      renderCandidates();
      setStatus(currentScanCandidates.length ? "候補を取得しました" : "候補なし", currentScanCandidates.length ? "success" : undefined);

    }catch(e){
      console.error(e);
      setStatus("読取失敗", "error");
      alert("読み取りに失敗しました。明るい場所で、品番を中央に大きく写して再度お試しください。");
    }finally{
      isScanning = false;
      els.scanBtn.disabled = false;
    }
  }

            <button class="btn-green" onclick="window.useScanCandidate(${i})">この候補を使う
