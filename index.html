<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>型番スキャナー検索</title>
<style>
:root { --primary: #4285f4; --secondary: #34a853; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
.container { width: 90%; max-width: 400px; text-align: center; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
h1 { font-size: 1.2rem; color: #333; margin-bottom: 20px; }
.btn { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 1rem; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: transform 0.1s; color: white; text-decoration: none; }
.btn:active { transform: scale(0.98); }
.btn-manual { background: var(--primary); }
.btn-spec { background: var(--secondary); }
.info { font-size: 0.8rem; color: #777; margin-top: 15px; line-height: 1.4; }
</style>
</head>
<body>

<div class="container">
<h1>📄 型番検索ツール</h1>

<button class="btn btn-manual" onclick="doSearch('取扱説明書')">📖 取扱説明書を検索</button>
<button class="btn btn-spec" onclick="doSearch('仕様書')">📑 仕様書を検索</button>

<div class="info">
Googleレンズで型番を<b>「コピー」</b>してから<br>上のボタンを押してください。
</div>
</div>

<script>
async function doSearch(type) {
try {
// クリップボードから型番を取得
const text = await navigator.clipboard.readText();
if (!text || text.trim() === "") {
alert("クリップボードが空です。\nGoogleレンズで型番をコピーしてください。");
return;
}

// 検索クエリ構築 (PDF限定、余計なサイト除外)
const keyword = text.trim();
const query = encodeURIComponent(`${keyword} "${type}" filetype:pdf`);
const url = `https://www.google.com/search?q=${query}`;

// 別タブではなく現在の画面で検索結果を表示
window.location.href = url;
} catch (err) {
alert("クリップボードへのアクセスを許可してください。\n(ブラウザの設定で許可が必要です)");
}
}
</script>

</body>
</html>
