<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>電材スキャンPRO 完成版</title>

<style>
:root{
  --bg:#101418;--card:#1b2229;--line:#2e3a45;
  --text:#f5f7fa;--sub:#a7b3bf;
  --ok:#00c853;--blue:#2962ff;--orange:#ff9800;--danger:#ff5252;
}
body{margin:0;background:var(--bg);color:var(--text);font-family:sans-serif;text-align:center}
.wrap{max-width:840px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
input,button{width:100%;padding:14px;margin:6px 0;border-radius:10px;border:none;font-size:16px}
button{background:var(--ok);color:#fff}
.secondary{background:var(--blue)}
.orange{background:var(--orange)}
.dark{background:#455a64}
.danger{background:var(--danger)}
video{width:100%;max-height:48vh;background:#000;border-radius:12px}
.links a{display:block;background:var(--blue);margin:6px 0;padding:10px;border-radius:10px;color:#fff;text-decoration:none}
</style>

</head>

<body>
<div class="wrap">
<h2>📷 電材スキャンPRO 完成版</h2>

<div class="card">
<input id="site" placeholder="現場名">
<input id="manual" placeholder="品番・商品名入力">
</div>

<div class="card">
<button onclick="startCamera()">カメラ起動</button>
<button class="secondary" onclick="scan()">スキャン</button>
<button class="orange" onclick="manualSearch()">検索</button>
<button class="dark" onclick="share()">LINE共有</button>
<button class="danger" onclick="stopCamera()">停止</button>
</div>

<div class="card">
<label><input type="checkbox" id="modeMaker" checked> メーカー優先</label><br>
<label><input type="checkbox" id="modeJP" checked> 日本語OK</label><br>
<label><input type="checkbox" id="modeAll"> 全検索</label>
</div>

<video id="video" autoplay playsinline></video>

<div id="status"></div>
<div class="card" id="links"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>

let stream,worker;

const makers=["パナソニック","Panasonic","東芝","三菱電機","未来工業","ネグロス","テンパール","河村電器","オーデリック","大光電機","神保電器"];

function extractJP(t){return (t.match(/[\u3040-\u30FF\u4E00-\u9FFF]{2,}/g)||[]);}

async function startCamera(){
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
video.srcObject=stream;
}

function stopCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());}

async function getWorker(){
if(worker)return worker;
worker=await Tesseract.createWorker("eng");
return worker;
}

async function scan(){
status.innerText="読み取り中...";
const canvas=document.createElement("canvas");
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;
canvas.getContext("2d").drawImage(video,0,0);

const w=await getWorker();
const ret=await w.recognize(canvas);
const text=ret.data.text||"";

const code=(text.match(/[A-Z0-9\-]{4,}/)||[""])[0];
manual.value=code;

render(code,text);
status.innerText="完了";
}

function buildQueries(p,text){
let q=[];
const jp=extractJP(text);

const maker=modeMaker.checked;
const jpMode=modeJP.checked;
const all=modeAll.checked;

if(all){
if(p)q.push(p);
jp.forEach(w=>q.push(w));
}else{
if(maker){
makers.forEach(m=>{
if(p)q.push(m+" "+p);
if(jpMode)jp.forEach(w=>q.push(m+" "+w));
});
}
if(p)q.push(p);
if(jpMode)jp.forEach(w=>q.push(w));
}

return [...new Set(q)].slice(0,10);
}

function render(p,text){
const qs=buildQueries(p,text);

links.innerHTML=qs.map(q=>
`<a href="https://www.google.com/search?q=${encodeURIComponent(q+" 仕様書 図面")}" target="_blank">🔎 ${q}</a>`
).join("");
}

function manualSearch(){
render(manual.value,"");
}

async function share(){
const txt=site.value+"\n"+manual.value;
if(navigator.share){
await navigator.share({text:txt});
}else{
window.open("https://line.me/R/msg/text/?"+encodeURIComponent(txt));
}
}

</script>

</body>
</html>
