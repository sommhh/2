      } catch (e) { /* ignore */ }

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-text-size-adjust:100%}
body{background:#fff;overscroll-behavior:none;touch-action:none}
button,input,select,textarea{font-family:inherit;font-size:16px}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.app{display:flex;height:100vh;height:100dvh;width:100vw}

.tools button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.tools button:active{transform:scale(0.94)}
.hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.92);color:#fff;padding:9px 16px;border-radius:18px;font-size:12px;z-index:1000;pointer-events:none;opacity:0;transition:opacity .2s;max-width:90%;text-align:center}

.fab{position:absolute;bottom:86px;right:14px;width:52px;height:52px;border-radius:26px;background:#1e3a8a;color:#fff;border:none;font-size:22px;z-index:1001;display:none;box-shadow:0 3px 12px rgba(0,0,0,0.35);align-items:center;justify-content:center}
.sidebar.hide ~ .mapw .fab{display:flex}
@media(max-width:768px){.fab{display:flex}}
.marker-pole{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #000;box-shadow:0 2px 6px rgba(0,0,0,0.35)}
.marker-trans{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #dc2626;box-shadow:0 2px 6px rgba(0,0,0,0.35)}
.marker-label{background:#fff;border:2px solid #000;padding:3px 6px;font-size:11px;font-weight:700;white-space:nowrap;border-radius:4px;box-shadow:0 2px 5px rgba(0,0,0,0.3);transform:translate(-50%,-150%)}
.marker-label.red{border-color:#dc2626;color:#dc2626;background:#fef2f2}
.text-lab{background:#fff;border:2px solid #1f2937;padding:4px 8px;font-size:12px;font-weight:600;white-space:nowrap;border-radius:5px;box-shadow:0 2px 5px rgba(0,0,0,0.25)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:5000;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-size:17px;margin-bottom:14px}
.modal input{width:100%;padding:14px;border:2px solid #d1d5db;border-radius:12px;font-size:17px;margin-bottom:16px}
.modal input:focus{outline:none;border-color:#2563eb}
.modal-btns{display:flex;gap:10px}
.modal-btns button{flex:1;height:48px;border:none;border-radius:12px;font-size:16px;font-weight:600}
.modal-ok{background:#2563eb;color:#fff}
.modal-cancel{background:#f3f4f6}
.leaflet-control-attribution{font-size:10px!important;background:rgba(255,255,255,0.8)!important}
.leaflet-container{-webkit-tap-highlight-color:transparent}
</style>

<body>
<div class="app">
  <div class="sidebar" id="sb">
    <div class="head">
      <div class="top"><h1>⚡ 電力申請 v34.1</h1><button class="tg" id="tg" type="button">▼</button></div>
      <div class="btns">
        <button id="gps" type="button">📍 GPS</button>
        <button id="save" type="button">💾 保存</button>
        <button id="load" type="button">📂 読込</button>
        <button id="undo" type="button">↩️ 戻る</button>
        <button id="clear" type="button">🗑️ 全消</button>
        <button id="share" type="button">📤 共有</button>
      </div>
    </div>
    <div class="form">
      <div class="f"><label>現場名</label><input id="genba" placeholder="〇〇邸"></div>
      <div class="f"><label>住所</label><input id="jusho" placeholder="宮城県名取市..."></div>
      <div class="f"><label>工事</label><div class="r"><label><input type="radio" name="k" value="本設" checked>本設</label><label><input type="radio" name="k" value="仮設">仮設</label></div></div>
      <div class="f"><label>供給</label><div class="r v"><label><input type="radio" name="s" value="単相2線式 100V">単相2線</label><label><input type="radio" name="s" value="単相3線式 100V/200V" checked>単相3線</label><label><input type="radio" name="s" value="三相3線式 200V">三相3線</label></div></div>
      <div class="f"><label>契約</label><div class="r"><label><input type="radio" name="c" value="従量電灯B">従量B</label><label><input type="radio" name="c" value="従量電灯C">従量C</label></div></div>
      <div class="f"><label>容量</label><select id="amp"><option value="">選択</option><option>15A</option><option>20A</option><option>30A</option><option>40A</option><option>50A</option><option>60A</option><option>6kVA</option><option>8kVA</option><option>10kVA</option><option>12kVA</option><option>15kVA</option></select></div>
      <div class="f"><label>引込線</label><div style="display:flex;gap:6px"><select id="dv" style="flex:1"><option>DV2線</option><option selected>DV3線</option></select><select id="sz" style="width:80px"><option>3.2mm</option><option>22mm²</option><option>38mm²</option><option>60mm²</option></select></div></div>
      <div class="f"><label>区分</label><div class="r"><label><input type="checkbox" id="h1">二類</label><label><input type="checkbox" id="h2">三類</label><label><input type="checkbox" id="h3">空中分岐</label></div></div>
      <div class="f"><label>メーター</label><div class="r"><label><input type="radio" name="m" value="ベージュ" checked>ベージュ</label><label><input type="radio" name="m" value="グレー">グレー</label><label><input type="radio" name="m" value="なし">なし</label></div></div>
      <div class="f"><label>設備</label><div class="chk"><label><input type="checkbox" id="e1">太陽光</label><label><input type="checkbox" id="e2">エコキュート</label><label><input type="checkbox" id="e3">IH</label></div></div>
      <div class="f"><label>受点予定</label><input id="juten" type="date"></div>
      <div class="f"><label>検査日</label><input id="kensa" type="date"></div>
      <div class="f"><label>備考</label><textarea id="biko" rows="2"></textarea></div>
    </div>
  </div>
  <div class="mapw">
    <div id="map"></div>
    <button class="fab" id="fab" type="button">☰</button>
    <div class="tools" id="tools">
      <button data-t="pole" type="button">⚫<br>電柱</button>
      <button data-t="trans" type="button">🔴<br>トランス</button>
      <button data-t="line" type="button">〰️<br>低圧</button>
      <button data-t="hikikomi" type="button">↘️<br>引込</button>
      <button data-t="bunki" type="button">🔀<br>分岐</button>
      <button data-t="bld" type="button">⬜<br>建物</button>
      <button data-t="bldf" type="button">⬡<br>自由</button>
      <button data-t="text" type="button">📝<br>文字</button>
    </div>
    <div class="hint" id="hint">ツール選んで地図タップ</div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modal-title">入力</h3>
    <input id="modal-input" type="text" enterkeyhint="done" autocomplete="off">
    <div class="modal-btns">
      <button class="modal-cancel" id="modal-cancel" type="button">キャンセル</button>
      <button class="modal-ok" id="modal-ok" type="button">OK</button>
    </div>
  </div>
</div>

<script>
!function(){
  const $=id=>document.getElementById(id);
  const hint=$('hint'), modal=$('modal'), mi=$('modal-input');
  let resolveInput=null;
  
  function ask(title,ph=''){return new Promise(r=>{$('modal-title').textContent=title;mi.placeholder=ph;mi.value='';modal.classList.add('show');resolveInput=r;setTimeout(()=>mi.focus(),50)})}
  $('modal-ok').onclick=()=>{modal.classList.remove('show');if(resolveInput)resolveInput(mi.value);resolveInput=null};
  $('modal-cancel').onclick=()=>{modal.classList.remove('show');if(resolveInput)resolveInput(null);resolveInput=null};
  mi.onkeydown=e=>{if(e.key==='Enter')$('modal-ok').click()};
  modal.onclick=e=>{if(e.target===modal)$('modal-cancel').click()};
  
  const show=t=>{hint.textContent=t;hint.classList.add('show');clearTimeout(show._t);show._t=setTimeout(()=>hint.classList.remove('show'),2000)};
  const vib=p=>{try{if(navigator.vibrate)navigator.vibrate(p||10)}catch(e){}};
  const getR=n=>document.querySelector(`input[name="${n}"]:checked`)?.value||'';
  const setR=(n,v)=>{document.querySelectorAll(`input[name="${n}"]`).forEach(e=>e.checked=false);if(v){const e=document.querySelector(`input[name="${n}"][value="${v}"]`);if(e)e.checked=true}};
  
  // 地図 - iOS/Android最適化
  const map=L.map('map',{zoomControl:false,attributionControl:true,preferCanvas:true}).setView([38.172,140.882],18);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:21,attribution:'© OpenStreetMap'}).addTo(map);
  L.control.zoom({position:'bottomright'}).addTo(map);
  
  // リサイズ対策
  const fixSize=()=>setTimeout(()=>map.invalidateSize(),200);
  window.addEventListener('resize',fixSize);
  window.addEventListener('orientationchange',fixSize);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)fixSize()});
  setTimeout(fixSize,500);
  
  const state={tool:null,objs:[],undo:[],tmp:[],last:0,lastTap:0};
  
  function add(t,d){
    const o={t,id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),d};
    state.objs.push(o);state.undo.push(o);if(state.undo.length>150)state.undo.shift();
    render(o);save();vib(10);return o;
  }
  
  function render(o){
    const d=o.d;
    if(o.t==='pole'||o.t==='trans'){
      const html=`<div class="${o.t==='pole'?'marker-pole':'marker-trans'}"></div>`;
      o._m=L.marker([d.lat,d.lng],{icon:L.divIcon({className:'',html,iconSize:[26,26],iconAnchor:[13,13]}),interactive:false,keyboard:false}).addTo(map);
      if(d.n){o._l=L.marker([d.lat,d.lng],{icon:L.divIcon({className:'',html:`<div class="marker-label${o.t==='trans'?' red':''}">${d.n}</div>`}),interactive:false}).addTo(map)}
    }else if(o.t==='line'||o.t==='hikikomi'||o.t==='bunki'){
      const opt={color:o.t==='line'?'#000':'#dc2626',weight:4,opacity:0.95,interactive:false,lineCap:'round'};
      if(o.t==='bunki')opt.dashArray='6,8';
      o._m=L.polyline([[d.p1.lat,d.p1.lng],[d.p2.lat,d.p2.lng]],opt).addTo(map);
      if(d.dist){const mid=[(d.p1.lat+d.p2.lat)/2,(d.p1.lng+d.p2.lng)/2];o._l=L.marker(mid,{icon:L.divIcon({className:'',html:`<div class="marker-label red">${d.dist}m</div>`}),interactive:false}).addTo(map)}
    }else if(o.t==='bld'||o.t==='bldf'){
      const latlngs=d.ps.map(p=>[p.lat,p.lng]);
      o._m=L.polygon(latlngs,{color:o.t==='bldf'?'#2563eb':'#dc2626',weight:3,fillOpacity:0.14,interactive:false}).addTo(map);
    }else if(o.t==='text'){
      o._m=L.marker([d.lat,d.lng],{icon:L.divIcon({className:'',html:`<div class="text-lab">${d.text}</div>`}),interactive:false}).addTo(map);
    }
  }
  
  function clearAll(){state.objs.forEach(o=>{if(o._m)map.removeLayer(o._m);if(o._l)map.removeLayer(o._l)});state.objs=[]}
  
  // ペイント - クリック
  map.on('click',async e=>{
    if(!state.tool){show('ツールを選んでください');vib([20,30]);return}
    const now=Date.now();if(now-state.last<150)return;state.last=now;
    const ll=e.latlng;
    try{
      if(state.tool==='pole'){const n=await ask('電柱番号','例: 名取12');if(n===null)return;add('pole',{lat:ll.lat,lng:ll.lng,n:n.trim()});show('電柱配置')}
      else if(state.tool==='trans'){const n=await ask('トランス番号','');if(n===null)return;add('trans',{lat:ll.lat,lng:ll.lng,n:n.trim()});show('トランス')}
      else if(state.tool==='line'){state.tmp.push(ll);if(state.tmp.length===2){add('line',{p1:state.tmp[0],p2:state.tmp[1]});state.tmp=[];show('低圧線')}else show('終点をタップ')}
      else if(state.tool==='hikikomi'){state.tmp.push(ll);if(state.tmp.length===2){const d=map.distance(state.tmp[0],state.tmp[1]).toFixed(1);add('hikikomi',{p1:state.tmp[0],p2:state.tmp[1],dist:d});state.tmp=[];show(`引込 ${d}m`)}else show('終点')}
      else if(state.tool==='bunki'){state.tmp.push(ll);if(state.tmp.length===2){add('bunki',{p1:state.tmp[0],p2:state.tmp[1]});state.tmp=[];show('分岐')}else show('終点')}
      else if(state.tool==='bld'){state.tmp.push(ll);if(state.tmp.length===2){const a=state.tmp[0],b=state.tmp[1];add('bld',{ps:[{lat:a.lat,lng:a.lng},{lat:a.lat,lng:b.lng},{lat:b.lat,lng:b.lng},{lat:b.lat,lng:a.lng}]});state.tmp=[];show('建物')}else show('対角')}
      else if(state.tool==='bldf'){state.tmp.push(ll);const tapNow=Date.now();show(`${state.tmp.length}点`);if(state.tmp.length>=3&&tapNow-state.lastTap<400){add('bldf',{ps:state.tmp.map(p=>({lat:p.lat,lng:p.lng}))});state.tmp=[];show('自由形確定');state.lastTap=0;return}state.lastTap=tapNow}
      else if(state.tool==='text'){const t=await ask('文字入力','');if(!t)return;add('text',{lat:ll.lat,lng:ll.lng,text:t.trim()});show('文字')}
    }catch(err){console.error(err)}
  });
  
  // ツール
  document.querySelectorAll('#tools button').forEach(b=>{b.addEventListener('click',()=>{state.tool=b.dataset.t;state.tmp=[];document.querySelectorAll('#tools button').forEach(x=>x.classList.remove('on'));b.classList.add('on');const n={pole:'電柱',trans:'トランス',line:'低圧',hikikomi:'引込',bunki:'分岐',bld:'建物',bldf:'自由形',text:'文字'};show(n[state.tool]+'モード');vib(5)},{passive:true})});
  
  // GPS - iOS/Android完全対応
  $('gps').addEventListener('click',async()=>{
    const btn=$('gps');const old=btn.textContent;btn.disabled=true;btn.textContent='取得中';
    try{
      if(!navigator.geolocation)throw new Error('unsupported');
      if(location.protocol!=='https:'&&location.hostname!=='localhost'){show('HTTPSが必要です');}
      const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:20000,maximumAge:0}));
      const {latitude,longitude}=pos.coords;
      map.setView([latitude,longitude],19,{animate:true});
      try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}&accept-language=ja`);const d=await r.json();if(d?.address){const a=[d.address.state,d.address.city||d.address.town||d.address.village,d.address.suburb,d.address.road].filter(Boolean).join(' ');$('jusho').value=a.replace(/日本/g,'').trim()}}catch(e){}
      show('現在地表示');vib([10,20,10]);
    }catch(err){
      let m='位置情報エラー';
      if(err.code===1)m='設定→プライバシー→位置情報→Safariを「許可」';
      else if(err.code===2)m='GPS電波を確認';
      else if(err.code===3)m='タイムアウト';
      alert(m);
    }finally{btn.disabled=false;btn.textContent=old}
  });
  
  function save(){try{const d={v:'34.1',f:{genba:$('genba').value,jusho:$('jusho').value,koji:getR('k'),kyokyu:getR('s'),keiyaku:getR('c'),amp:$('amp').value,dv:$('dv').value,sz:$('sz').value,mbox:getR('m'),hk:['h1','h2','h3'].filter(id=>$(id).checked),eq:['e1','e2','e3'].filter(id=>$(id).checked),juten:$('juten').value,kensa:$('kensa').value,biko:$('biko').value},o:state.objs.map(o=>({t:o.t,d:o.d})),c:map.getCenter(),z:map.getZoom()};localStorage.setItem('dq341',JSON.stringify(d));return true}catch(e){return false}}
  function load(){try{const s=localStorage.getItem('dq341')||localStorage.getItem('dq34')||localStorage.getItem('dq33');if(!s)return false;const d=JSON.parse(s),f=d.f||{};$('genba').value=f.genba||'';$('jusho').value=f.jusho||'';setR('k',f.koji||'本設');setR('s',f.kyokyu||'単相3線式 100V/200V');setR('c',f.keiyaku||'');$('amp').value=f.amp||'';$('dv').value=f.dv||'DV3線';$('sz').value=f.sz||'3.2mm';setR('m',f.mbox||'ベージュ');['h1','h2','h3'].forEach(id=>$(id).checked=(f.hk||[]).includes(id));['e1','e2','e3'].forEach(id=>$(id).checked=(f.eq||[]).includes(id));$('juten').value=f.juten||'';$('kensa').value=f.kensa||'';$('biko').value=f.biko||'';if(d.c&&d.z)map.setView([d.c.lat,d.c.lng],d.z);clearAll();state.objs=[];state.undo=[];state.tmp=[];(d.o||[]).forEach(o=>{const no={t:o.t,d:o.d};state.objs.push(no);state.undo.push(no);render(no)});return true}catch(e){console.error(e);return false}}
  
  $('save').onclick=()=>{save();show('保存完了');vib(20)};
  $('load').onclick=()=>{if(load()){show('読込完了');vib(20)}else alert('データなし')};
  $('undo').onclick=()=>{if(!state.undo.length){show('戻せません');return}const l=state.undo.pop();state.objs=state.objs.filter(o=>o!==l);if(l._m)map.removeLayer(l._m);if(l._l)map.removeLayer(l._l);save();show('取消');vib(10)};
  $('clear').onclick=()=>{if(confirm('全削除しますか')){clearAll();state.undo=[];save();show('削除');vib([10,20])}};
  $('share').onclick=async()=>{const g=$('genba').value||'現場';const c=map.getCenter();const url=`https://www.openstreetmap.org/#map=19/${c.lat}/${c.lng}`;const t=`${g}
${$('jusho').value}
${url}`;try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);show('コピーしました')}}catch(e){}};
  
  const sb=$('sb'),tg=$('tg'),fab=$('fab');
  tg.onclick=()=>{const h=!sb.classList.contains('hide');sb.classList.toggle('hide',h);tg.textContent=h?'▲':'▼';localStorage.setItem('sb',h?'1':'0')};
  fab.onclick=()=>{sb.classList.remove('hide');tg.textContent='▼'};
  if(localStorage.getItem('sb')==='1'&&innerWidth<769){sb.classList.add('hide');tg.textContent='▲'}
  
  let st;document.querySelectorAll('input,select,textarea').forEach(e=>e.addEventListener('input',()=>{clearTimeout(st);st=setTimeout(save,800)}));
  setInterval(save,25000);
  
  window.addEventListener('load',()=>setTimeout(()=>{if(localStorage.getItem('dq341')){if(confirm('前回データ復元しますか'))load()}else show('ツール選択→地図タップで配置')},700));
}();
</script>
</body>
</html>
