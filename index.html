<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>位置図Pro 安定完成版</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body{
  margin:0;
  font-family:Meiryo,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}

header{
  background:#0f172a;
  color:#fff;
  padding:8px;
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

button{
  padding:8px;
  border-radius:6px;
  border:0;
  background:#e2e8f0;
}

.primary{background:#2563eb;color:#fff}

#app{
  display:flex;
  height:100dvh;
}

aside{
  width:300px;
  background:#f8fafc;
  border-right:1px solid #ccc;
  padding:10px;
  overflow:auto;
}

aside input,aside select,aside textarea{
  width:100%;
  padding:6px;
  margin-top:3px;
}

#map{
  flex:1;
}

.toolbar{
  position:absolute;
  top:8px;
  left:8px;
  background:#fff;
  padding:5px;
  z-index:1000;
  border-radius:6px;
}

.compass{
  position:absolute;
  top:8px;
  right:8px;
  width:50px;
  height:50px;
  background:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}
</style>
</head>

<body>

<header>
<button id="gps" class="primary">GPS</button>
<button id="save">保存</button>
<button id="load">読込</button>
<button id="list">一覧</button>
<button id="undo">戻る</button>
<button id="clear">全消</button>
<button id="shot">📸</button>
<button id="print">印刷</button>
<button id="line">LINE</button>
</header>

<div id="app">

<aside>
<input id="genba" placeholder="現場名">
<input id="jusho" placeholder="住所">
</aside>

<div id="map">
<div class="toolbar">
<button data-m="pole">電柱</button>
<button data-m="trans">Tr</button>
<button data-m="house">🏠</button>
<button data-m="lv">低圧</button>
<button data-m="dist">距離</button>
</div>
<div class="compass" id="comp">↑</div>
</div>

</div>

<script>
const $=id=>document.getElementById(id);

// マップ
const map=L.map('map',{doubleClickZoom:false}).setView([38.17,140.86],17);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

const drawn=L.featureGroup().addTo(map);

let mode='pole',hist=[],cur=null,d1=null;

// モード
document.querySelectorAll('[data-m]').forEach(b=>{
 b.onclick=()=>mode=b.dataset.m;
});

// アイコン
const icon=(txt,color)=>L.divIcon({
 html:`<div style="text-align:center">
 <div style="width:16px;height:16px;border-radius:50%;background:${color}"></div>
 <div style="font-size:10px">${txt}</div></div>`
});

// 描画
map.on('click',e=>{
 if(mode==='pole'||mode==='trans'){
  const n=prompt('番号'); if(!n)return;
  const m=L.marker(e.latlng,{icon:icon(n,mode==='trans'?'red':'black'),draggable:true}).addTo(drawn);
  m.k='p'; m.n=n; m.t=(mode==='trans');
  hist.push(m);
 }
 else if(mode==='house'){
  const m=L.marker(e.latlng,{icon:icon('家','green')}).addTo(drawn);
  m.k='h'; hist.push(m);
 }
 else if(mode==='lv'){
  if(!cur){
   cur=L.polyline([e.latlng],{color:'#000'}).addTo(drawn);
   cur.k='lv'; hist.push(cur);
  } else cur.addLatLng(e.latlng);
 }
 else if(mode==='dist'){
  if(!d1)d1=e.latlng;
  else{
   const d=map.distance(d1,e.latlng);
   L.polyline([d1,e.latlng],{color:'red'}).addTo(drawn);
   alert("距離:"+Math.round(d)+"m");
   d1=null;
  }
 }
});

map.on('dblclick',()=>cur=null);

// GPS
$('gps').onclick=()=>{
 navigator.geolocation.getCurrentPosition(p=>{
  map.setView([p.coords.latitude,p.coords.longitude],19);
 },e=>alert("GPS失敗:"+e.message));
};

// 保存
$('save').onclick=()=>{
 const data={
  genba:$('genba').value,
  jusho:$('jusho').value,
  layers:hist.map(l=>{
   if(l.k==='p')return{t:'p',lat:l.getLatLng().lat,lon:l.getLatLng().lng,n:l.n,tr:l.t};
   if(l.k==='h')return{t:'h',lat:l.getLatLng().lat,lon:l.getLatLng().lng};
   if(l.k==='lv')return{t:'lv',pts:l.getLatLngs().map(p=>[p.lat,p.lng])};
  }).filter(Boolean)
 };
 localStorage.setItem("MAP_"+data.genba,JSON.stringify(data));
 alert("保存OK");
};

// 読込
$('load').onclick=()=>{
 const k=prompt("現場名");
 const d=JSON.parse(localStorage.getItem("MAP_"+k)||'null');
 if(!d)return alert("なし");

 drawn.clearLayers(); hist=[];

 d.layers.forEach(o=>{
  if(o.t==='p'){
   const m=L.marker([o.lat,o.lon],{icon:icon(o.n,o.tr?'red':'black')}).addTo(drawn);
   m.k='p'; hist.push(m);
  }
  if(o.t==='h'){
   const m=L.marker([o.lat,o.lon],{icon:icon('家','green')}).addTo(drawn);
   m.k='h'; hist.push(m);
  }
  if(o.t==='lv'){
   const l=L.polyline(o.pts).addTo(drawn);
   l.k='lv'; hist.push(l);
  }
 });
};

// 一覧
$('list').onclick=()=>{
 alert(Object.keys(localStorage).filter(k=>k.startsWith("MAP_")).join("\n"));
};

// undo
$('undo').onclick=()=>{
 const l=hist.pop();
 if(l)drawn.removeLayer(l);
};

// clear
$('clear').onclick=()=>{
 if(confirm("全削除？")){
  drawn.clearLayers(); hist=[];
 }
};

// スクショ
$('shot').onclick=()=>{
 html2canvas(document.body).then(c=>{
  const a=document.createElement("a");
  a.href=c.toDataURL();
  a.download="map.png";
  a.click();
 });
};

// 印刷
$('print').onclick=()=>window.print();

// LINE
$('line').onclick=()=>{
 const c=map.getCenter();
 const txt=`${$('genba').value}
${$('jusho').value}
https://maps.google.com/?q=${c.lat},${c.lng}`;
 location.href='https://line.me/R/msg/text/?'+encodeURIComponent(txt);
};

// ★最重要：高さ補正
function fixHeight(){
 document.getElementById('app').style.height=window.innerHeight+"px";
 setTimeout(()=>map.invalidateSize(),300);
}

window.addEventListener('load',fixHeight);
window.addEventListener('resize',fixHeight);
window.addEventListener('orientationchange',fixHeight);

// コンパス
window.addEventListener("deviceorientation",e=>{
 if(e.alpha!=null){
  $('comp').style.transform=`rotate(${e.alpha}deg)`;
 }
});
</script>

</body>
</html>
