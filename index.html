<script>// Playables SDK v1.0.0
// Game lifecycle bridge: rAF-based game-ready detection + event communication
(function() {
  'use strict';

  // Idempotency: skip if already initialized (e.g., server-side injection
  // followed by client-side inject-javascript via the Bloks webview component).
  if (window.playablesSDK) return;

  var HANDLER_NAME = 'playablesGameEventHandler';
  var ANDROID_BRIDGE_NAME = '_MetaPlayablesBridge';
  var RAF_FRAME_THRESHOLD = 3;

  var gameReadySent = false;
  var firstInteractionSent = false;
  var errorSent = false;
  var frameCount = 0;
  var originalRAF = window.requestAnimationFrame;

  // --- Transport Layer ---

  function hasIOSBridge() {
    return !!(window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers[HANDLER_NAME]);
  }

  function hasAndroidBridge() {
    return !!(window[ANDROID_BRIDGE_NAME] &&
              typeof window[ANDROID_BRIDGE_NAME].postEvent === 'function');
  }

  function isInIframe() {
    return !!(window.parent && window.parent !== window);
  }

  function sendEvent(eventName, payload) {
    var message = {
      type: eventName,
      payload: payload || {},
      timestamp: Date.now()
    };

    if (hasIOSBridge()) {
      try {
        window.webkit.messageHandlers[HANDLER_NAME].postMessage(message);
      } catch (e) { /* ignore */ }
      return;
    }

    if (hasAndroidBridge()) {
    try {
      var p = payload || {};
      p.__secureToken = window.__fbAndroidBridgeAuthToken || '';
      window[ANDROID_BRIDGE_NAME].postEvent(
        eventName,
        JSON.stringify(p)
      );
    } catch (e) { /* ignore */ }
    return;
  }

    if (isInIframe()) {
      try {
        window.parent.postMessage(message, '*');
      } catch (e) { /* ignore */ }
      return;
    }
  }

  // --- rAF Game-Ready Detection ---

  function onFrame() {
    if (gameReadySent) return;

    frameCount++;
    if (frameCount >= RAF_FRAME_THRESHOLD) {
      gameReadySent = true;
      sendEvent('game_ready', {
        frame_count: frameCount,
        detected_at: Date.now()
      });
      return;
    }

    originalRAF.call(window, onFrame);
  }

  if (originalRAF) {
    window.requestAnimationFrame = function(callback) {
      if (!gameReadySent) {
        return originalRAF.call(window, function(timestamp) {
          frameCount++;
          if (frameCount >= RAF_FRAME_THRESHOLD && !gameReadySent) {
            gameReadySent = true;
            sendEvent('game_ready', {
              frame_count: frameCount,
              detected_at: Date.now()
            });
          }
          callback(timestamp);
        });
      }
      return originalRAF.call(window, callback);
    };
  }

  // --- First User Interaction Detection ---

  function setupFirstInteractionDetection() {
    var events = ['touchstart', 'mousedown', 'keydown'];

    function onFirstInteraction() {
      if (firstInteractionSent) return;
      firstInteractionSent = true;
      sendEvent('user_interaction_start', null);

      for (var i = 0; i < events.length; i++) {
        document.removeEventListener(events[i], onFirstInteraction, true);
      }
    }

    for (var i = 0; i < events.length; i++) {
      document.addEventListener(events[i], onFirstInteraction, true);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupFirstInteractionDetection);
  } else {
    setupFirstInteractionDetection();
  }

  // --- Auto Error Capture ---

  window.addEventListener('error', function(event) {
    if (errorSent) return;
    errorSent = true;
    sendEvent('error', {
      message: event.message || 'Unknown error',
      source: event.filename || '',
      lineno: event.lineno || 0,
      colno: event.colno || 0,
      auto_captured: true
    });
  });

  window.addEventListener('unhandledrejection', function(event) {
    if (errorSent) return;
    errorSent = true;
    var reason = event.reason;
    sendEvent('error', {
      message: (reason instanceof Error) ? reason.message : String(reason),
      type: 'unhandled_promise_rejection',
      auto_captured: true
    });
  });

  // --- Public API ---

  window.playablesSDK = {
    complete: function(score) {
      sendEvent('game_ended', {
        score: score,
        completed: true
      });
    },

    error: function(message) {
      if (errorSent) return;
      errorSent = true;
      sendEvent('error', {
        message: message || 'Unknown error',
        auto_captured: false
      });
    },

    sendEvent: function(eventName, payload) {
      if (!eventName || typeof eventName !== 'string') return;
      sendEvent(eventName, payload);
    }
  };

  // Kick off rAF detection in case no game code calls rAF immediately
  if (originalRAF) {
    originalRAF.call(window, onFrame);
  }
})();</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>電力申請用 位置図Pro v5</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;background:#fff;color:#111}
body{display:flex;flex-direction:column;overscroll-behavior:none}
header{background:#111827;color:#fff;padding:8px 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;z-index:2000}
header button{background:#374151;color:#fff;border:none;padding:10px 12px;border-radius:10px;font-size:14px;min-height:44px;min-width:44px;touch-action:manipulation}
header button:active{background:#4b5563}
#togglePanel{background:#1f2937;font-weight:bold}
main{flex:1;display:flex;min-height:0;position:relative}
#panel{width:320px;background:#f9fafb;border-right:1px solid #e5e7eb;overflow:auto;padding:14px;transition:transform .25s ease;z-index:1500}
#panel.collapsed{transform:translateX(-102%)}
.form-group{margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:#374151}
input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #2563eb33;border-color:#2563eb}
textarea{min-height:70px;resize:vertical}
.radio-group{display:flex;gap:14px;flex-wrap:wrap}
.radio-group label{display:flex;align-items:center;gap:6px;font-weight:500}
#mapWrap{flex:1;position:relative;background:#ddd}
#map{position:absolute;inset:0}
.toolbar{position:absolute;top:10px;left:10px;z-index:900;display:flex;flex-direction:column;gap:7px;background:rgba(255,255,255,.97);padding:8px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.18);backdrop-filter:blur(4px)}
.toolbar button{padding:10px 12px;border:1px solid #d1d5db;background:#fff;border-radius:9px;font-size:14px;min-height:44px;min-width:92px;text-align:center;touch-action:manipulation}
.toolbar button.active{background:#2563eb;color:#fff;border-color:#2563eb;font-weight:600}
.compass{position:absolute;top:10px;right:10px;z-index:900;width:72px;height:72px;background:rgba(255,255,255,.97);border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}
.compass-inner{position:relative;width:58px;height:58px;font-size:12px;color:#374151}
.compass-n{position:absolute;top:0;left:50%;transform:translateX(-50%);font-weight:700;color:#dc2626}
.compass-s{position:absolute;bottom:0;left:50%;transform:translateX(-50%)}
.compass-e{position:absolute;right:0;top:50%;transform:translateY(-50%)}
.compass-w{position:absolute;left:0;top:50%;transform:translateY(-50%)}
.compass-arrow{position:absolute;top:50%;left:50%;width:2px;height:26px;background:#dc2626;transform:translate(-50%,-100%);transform-origin:bottom}
.compass-arrow::after{content:'';position:absolute;top:-7px;left:-5px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:9px solid #dc2626}
.statusbar{position:absolute;bottom:0;left:0;right:0;background:rgba(17,24,39,.92);color:#e5e7eb;font-size:12px;padding:6px 10px;display:flex;justify-content:space-between;gap:10px;z-index:900;backdrop-filter:blur(2px)}
.pole-icon .circle{width:26px;height:26px;background:#fff;border:2.5px solid #111; border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.pole-icon.trans .circle{border-color:#ea580c;border-width:3px}
.pole-icon .label{margin-top:2px;text-align:center;font-size:11px;background:#fff;padding:1px 4px;border-radius:4px;white-space:nowrap;border:1px solid #6b7280;line-height:1.2;font-weight:600;color:#111;transform:translateX(-25%)}
.pole-icon.trans .label{border-color:#ea580c;color:#ea580c}
.text-label{background:rgba(255,255,255,.95);padding:5px 8px;border:2px solid #e60012;border-radius:6px;font-size:14px;color:#e60012;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.leaflet-container{font-family:inherit}
@media(max-width:820px){
 #panel{position:absolute;left:0;top:0;bottom:0;height:100%;box-shadow:2px 0 20px rgba(0,0,0,.25)}
 header{padding:6px}
 header button{font-size:13px;padding:9px 10px}
 .toolbar{top:8px;left:8px;padding:6px;gap:6px}
 .toolbar button{min-width:80px;font-size:13px;padding:9px 10px}
}
</style>
</head>
<body>
<header>
<button id="togglePanel" title="メニューを開閉">☰</button>
<button onclick="doGPS()">📍GPS現在地</button>
<button onclick="shareLINE()">💬LINE共有</button>
<button onclick="saveData()">💾保存</button>
<button onclick="loadData()">📂読込</button>
<button onclick="undo()">↶戻る</button>
<button onclick="clearAll()">🗑全消し</button>
<button onclick="exportPNG()">🖼PNG出力</button>
</header>
<main>
<aside id="panel">
<div class="form-group"><label for="genba">現場名</label><input id="genba" type="text" placeholder="例：〇〇市〇〇 1-2-3"></div>
<div class="form-group"><label for="koji">工事種別</label><select id="koji"><option>本設</option><option>仮設</option></select></div>
<div class="form-group"><label for="kyuden">供給区分</label><select id="kyuden"><option>単相2線</option><option selected>単相3線</option><option>三相3線</option></select></div>
<div class="form-group"><label for="rui">二類/三類</label><select id="rui"><option>二類</option><option>三類</option></select></div>
<div class="form-group"><label for="kansei">受点完成日</label><input id="kansei" type="date"></div>
<div class="form-group"><label for="kensa">検査希望日</label><input id="kensa" type="date"></div>
<div class="form-group"><label>メーターBOX色</label><div class="radio-group"><label><input type="radio" name="meter" value="ベージュ" checked>ベージュ</label><label><input type="radio" name="meter" value="グレー">グレー</label><label><input type="radio" name="meter" value="黒">黒</label></div></div>
<div class="form-group"><label for="biko">備考</label><textarea id="biko" placeholder="近傍の目標物など"></textarea></div>
<div class="form-group"><label for="address">住所検索</label><div style="display:flex;gap:6px"><input id="address" type="text" placeholder="住所を入力"><button onclick="searchAddress()" style="padding:11px 14px;background:#2563eb;color:#fff;border:none;border-radius:8px;min-height:44px;min-width:70px">検索</button></div></div>
</aside>
<div id="mapWrap">
<div id="map"></div>
<div class="toolbar">
<button data-tool="pole" onclick="setTool('pole')">電柱○</button>
<button data-tool="trans" onclick="setTool('trans')">トランス○</button>
<button data-tool="line" onclick="setTool('line')">引込線</button>
<button data-tool="rect" onclick="setTool('rect')">建物囲み</button>
<button data-tool="text" onclick="setTool('text')">テキスト</button>
</div>
<div class="compass"><div class="compass-inner"><div class="compass-n">N</div><div class="compass-e">E</div><div class="compass-s">S</div><div class="compass-w">W</div><div class="compass-arrow"></div></div></div>
<div class="statusbar"><div id="coords">緯度:--- 経度:---</div><div id="statusMsg">待機中</div></div>
</div>
</main>
<script>
let map, currentTool=null, allObjects=[], tempLine=null, drawingRectStart=null, gpsMarker=null;
document.getElementById('togglePanel').onclick=()=>{document.getElementById('panel').classList.toggle('collapsed')};

document.addEventListener('DOMContentLoaded',()=>{
 map=L.map('map',{preferCanvas:true,zoomControl:false,doubleClickZoom:true}).setView([35.681236,139.767125],17);
 L.control.zoom({position:'bottomright'}).addTo(map);
 const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap',crossOrigin:true});
 const esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles © Esri',crossOrigin:true});
 osm.addTo(map);
 L.control.layers({'地図':osm,'航空写真':esri},{},{position:'topright',collapsed:true}).addTo(map);
 map.on('click',onMapClick);
 map.on('dblclick',onMapDblClick);
 map.on('mousemove',e=>{document.getElementById('coords').textContent=`緯度:${e.latlng.lat.toFixed(6)} 経度:${e.latlng.lng.toFixed(6)}`;});
 map.on('moveend',()=>{const c=map.getCenter();document.getElementById('coords').textContent=`中心:${c.lat.toFixed(6)}, ${c.lng.toFixed(6)} Z:${map.getZoom()}`;});
 if(window.innerWidth<820)document.getElementById('panel').classList.add('collapsed');
 updateStatus();
});

function setTool(t){
 if(currentTool===t){currentTool=null}else{currentTool=t}
 if(tempLine){map.removeLayer(tempLine);tempLine=null}
 drawingRectStart=null;
 document.querySelectorAll('.toolbar button').forEach(b=>b.classList.toggle('active',b.dataset.tool===currentTool));
 map.getContainer().style.cursor=currentTool?'crosshair':'';
 if(currentTool==='line'){map.doubleClickZoom.disable()}else{map.doubleClickZoom.enable()}
 updateStatus();
}
function updateStatus(){
 const names={pole:'電柱○ 追加中 - 地図をタップ',trans:'トランス○ 追加中 - 地図をタップ',line:'引込線 作図中 - タップで追加、ダブルタップで確定',rect:'建物囲み - 対角2点をタップ',text:'テキスト 追加中 - 地図をタップ'};
 document.getElementById('statusMsg').textContent=names[currentTool]||'待機中';
}

function getPoleIcon(num,isTrans){
 return L.divIcon({className:'pole-icon'+(isTrans?' trans':''),html:`<div class="circle"></div><div class="label">${num||''}</div>`,iconSize:[28,40],iconAnchor:[14,13]});
}
function createPoleMarker(latlng,number,isTrans){
 const m=L.marker(latlng,{draggable:true,icon:getPoleIcon(number,isTrans),riseOnHover:true});
 m._type=isTrans?'trans':'pole'; m._number=number;
 m.on('dblclick',e=>{L.DomEvent.stopPropagation(e);const nn=prompt('電柱番号を入力',m._number);if(nn!==null){m._number=nn;m.setIcon(getPoleIcon(nn,isTrans));}});
 m.addTo(map); allObjects.push(m);
}
function createTextMarker(latlng,text){
 const icon=L.divIcon({className:'',html:`<div class="text-label">${text}</div>`});
 const m=L.marker(latlng,{draggable:true,icon});
 m._type='text'; m._text=text;
 m.on('dblclick',e=>{L.DomEvent.stopPropagation(e);const nt=prompt('テキストを編集',m._text);if(nt!==null){m._text=nt;m.setIcon(L.divIcon({className:'',html:`<div class="text-label">${nt}</div>`}));}});
 m.addTo(map); allObjects.push(m);
}

function onMapClick(e){
 if(!currentTool)return;
 if(currentTool==='pole'){const n=prompt('電柱番号を入力');if(n)createPoleMarker(e.latlng,n,false);}
 else if(currentTool==='trans'){const n=prompt('電柱番号を入力');if(n)createPoleMarker(e.latlng,n,true);}
 else if(currentTool==='line'){if(!tempLine){tempLine=L.polyline([e.latlng],{color:'#e60012',weight:4,dashArray:'6,4'}).addTo(map);}else{tempLine.addLatLng(e.latlng);}}
 else if(currentTool==='rect'){if(!drawingRectStart){drawingRectStart=e.latlng;setStatusTemp('対角を選択してください');}else{const r=L.rectangle([drawingRectStart,e.latlng],{color:'#e60012',weight:3,fill:false});r._type='rect';r.addTo(map);allObjects.push(r);drawingRectStart=null;updateStatus();}}
 else if(currentTool==='text'){const t=prompt('テキストを入力');if(t)createTextMarker(e.latlng,t);}
}
function onMapDblClick(e){
 if(currentTool==='line' && tempLine){
  L.DomEvent.stopPropagation(e);
  const latlngs=tempLine.getLatLngs();
  if(latlngs.length>1)latlngs.pop();
  map.removeLayer(tempLine);tempLine=null;
  if(latlngs.length>=2){const line=L.polyline(latlngs,{color:'#e60012',weight:4});line._type='line';line.addTo(map);allObjects.push(line);}
  setStatusTemp('引込線を確定しました');
 }
}
function setStatusTemp(msg){const el=document.getElementById('statusMsg');el.textContent=msg;setTimeout(updateStatus,1500);}

function undo(){if(allObjects.length){const l=allObjects.pop();map.removeLayer(l);}if(tempLine){map.removeLayer(tempLine);tempLine=null}}
function clearAllSilent(){allObjects.forEach(l=>map.removeLayer(l));allObjects=[];if(tempLine){map.removeLayer(tempLine);tempLine=null}drawingRectStart=null;if(gpsMarker){map.removeLayer(gpsMarker);gpsMarker=null}}
function clearAll(){if(confirm('全ての作図を削除しますか？')){clearAllSilent();setStatusTemp('全消去しました')}}

function doGPS(){
 if(!navigator.geolocation){alert('この端末では位置情報が利用できません');return}
 setStatusTemp('GPS取得中…');
 navigator.geolocation.getCurrentPosition(pos=>{
  const {latitude:lat,longitude:lng}=pos.coords;
  map.setView([lat,lng],19);
  if(gpsMarker)map.removeLayer(gpsMarker);
  gpsMarker=L.circleMarker([lat,lng],{radius:9,color:'#2563eb',weight:3,fillColor:'#3b82f6',fillOpacity:0.9}).addTo(map).bindPopup('現在地').openPopup();
  setStatusTemp('現在地に移動しました');
 },err=>{
  alert('位置情報の取得が拒否されました。ブラウザの設定で許可してください。');
 },{enableHighAccuracy:true,timeout:12000,maximumAge:0});
}

function getForm(){return{genba:val('genba'),koji:val('koji'),kyuden:val('kyuden'),rui:val('rui'),kansei:val('kansei'),kensa:val('kensa'),meter:document.querySelector('input[name="meter"]:checked')?.value||'',biko:val('biko'),address:val('address')}}
function val(id){return document.getElementById(id).value.trim()}
function setForm(f){document.getElementById('genba').value=f.genba||'';document.getElementById('koji').value=f.koji||'本設';document.getElementById('kyuden').value=f.kyuden||'単相3線';document.getElementById('rui').value=f.rui||'二類';document.getElementById('kansei').value=f.kansei||'';document.getElementById('kensa').value=f.kensa||'';document.getElementById('biko').value=f.biko||'';document.getElementById('address').value=f.address||'';if(f.meter){const r=document.querySelector(`input[name="meter"][value="${f.meter}"]`);if(r)r.checked=true}}

function saveData(){
 const f=getForm();
 if(!f.genba){alert('現場名を入力してください');document.getElementById('genba').focus();return}
 const data={form:f,map:{center:[map.getCenter().lat,map.getCenter().lng],zoom:map.getZoom()},objects:allObjects.map(o=>{
  if(o._type==='pole'||o._type==='trans')return{type:o._type,lat:o.getLatLng().lat,lng:o.getLatLng().lng,number:o._number};
  if(o._type==='line')return{type:'line',latlngs:o.getLatLngs().map(p=>[p.lat,p.lng])};
  if(o._type==='rect'){const b=o.getBounds();return{type:'rect',sw:[b.getSouthWest().lat,b.getSouthWest().lng],ne:[b.getNorthEast().lat,b.getNorthEast().lng]}}
  if(o._type==='text')return{type:'text',lat:o.getLatLng().lat,lng:o.getLatLng().lng,text:o._text};
 }).filter(Boolean)};
 localStorage.setItem('den_'+f.genba,JSON.stringify(data));
 setStatusTemp('保存しました');alert('保存しました');
}
function loadData(){
 const keys=Object.keys(localStorage).filter(k=>k.startsWith('den_')).map(k=>k.slice(4));
 if(!keys.length){alert('保存データがありません');return}
 const name=prompt('読込する現場名を入力または選択:\n'+keys.join('\n'));
 if(!name)return;
 const raw=localStorage.getItem('den_'+name);
 if(!raw){alert('データが見つかりません');return}
 const data=JSON.parse(raw);
 clearAllSilent();
 setForm(data.form||{});
 if(data.map)map.setView(data.map.center,data.map.zoom);
 (data.objects||[]).forEach(o=>{
  if(o.type==='pole'||o.type==='trans')createPoleMarker([o.lat,o.lng],o.number,o.type==='trans');
  else if(o.type==='line'){const l=L.polyline(o.latlngs,{color:'#e60012',weight:4});l._type='line';l.addTo(map);allObjects.push(l);}
  else if(o.type==='rect'){const r=L.rectangle([[o.sw[0],o.sw[1]],[o.ne[0],o.ne[1]]],{color:'#e60012',weight:3,fill:false});r._type='rect';r.addTo(map);allObjects.push(r);}
  else if(o.type==='text')createTextMarker([o.lat,o.lng],o.text);
 });
 setStatusTemp('読込完了');alert('読込完了');
}

function shareLINE(){
 const f=getForm();
 const c=map.getCenter();
 const poles=allObjects.filter(o=>o._type==='pole'||o._type==='trans').map(o=>o._number+(o._type==='trans'?'(Tr)':'')).join('、')||'なし';
 const text=`【${f.genba||'現場名未設定'}】 工事:${f.koji}/${f.kyuden}/${f.rui} メーター:${f.meter} 完成:${f.kansei||'-'} 検査:${f.kensa||'-'} 位置:https://maps.google.com/?q=${c.lat.toFixed(6)},${c.lng.toFixed(6)} 電柱:${poles} 備考:${f.biko||'-'}`;
 if(navigator.share){navigator.share({title:'位置図',text}).catch(()=>{});}else{window.open('https://line.me/R/msg/text/?'+encodeURIComponent(text),'_blank');}
}

async function exportPNG(){
 const f=getForm();
 setStatusTemp('PNG生成中…');
 try{
  const mapEl=document.getElementById('map');
  const canvas=await html2canvas(mapEl,{useCORS:true,allowTaint:false,logging:false,scale:2,backgroundColor:'#e5e7eb'});
  const a=document.createElement('a');
  a.download=(f.genba||'位置図')+'.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
  setStatusTemp('PNG出力完了');
 }catch(e){console.error(e);alert('PNG出力に失敗しました。航空写真の場合は地図に切り替えてお試しください。')}
}

async function searchAddress(){
 const q=val('address'); if(!q){alert('住所を入力してください');return}
 setStatusTemp('住所検索中…');
 try{
  const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=jp&limit=1&addressdetails=1`,{headers:{'Accept-Language':'ja'}});
  const data=await res.json();
  if(data.length){const r=data[0];map.setView([parseFloat(r.lat),parseFloat(r.lon)],18);setStatusTemp('検索完了');}else{alert('住所が見つかりませんでした');updateStatus();}
 }catch(e){alert('検索エラーが発生しました');updateStatus();}
}
</script>
